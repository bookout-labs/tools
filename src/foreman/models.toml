# Families and effort. The router picks a family. Quota exhaustion tries the next.
# A live run resolves each family to the newest installed model.
# Nodes do not edit this file.

effort = "high"
max_review_rounds = 3

[nodes.triage]
role = "coordinator"
models = ["opus", "grok", "sol"]

[nodes.research]
role = "coordinator"
models = ["opus", "grok", "sol"]

[nodes.spec]
role = "coordinator"
models = ["opus", "grok", "sol"]

[nodes.implement]
role = "builder"
models = ["sol", "terra", "opus", "grok"]

[nodes.review]
role = "verifier"
other_family_from = "implement"
models = ["opus", "sol", "grok"]

[nodes.verify]
role = "check"
models = []
