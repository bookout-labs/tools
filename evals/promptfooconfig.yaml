# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: Delivery graph and scorer contract. No model is called.

prompts:
  - "{{case}}"

providers:
  - id: file://provider.py
    label: delivery-graph

tests:
  - description: A clear change is implemented and the check passes
    vars:
      case: clear
    assert:
      - type: equals
        value: verified
  - description: An approved spec is implemented
    vars:
      case: spec-ready
    assert:
      - type: equals
        value: verified
  - description: A small parent issue that triages implement skips spec and finishes verified
    vars:
      case: parent
    assert:
      - type: equals
        value: verified
  - description: A parent issue that triages spec reaches spec and stops sliced
    vars:
      case: parent-spec
    assert:
      - type: equals
        value: sliced
  - description: An open product choice stops for a person
    vars:
      case: spec-gate
    assert:
      - type: equals
        value: needs_human
  - description: A question is answered and does not change code
    vars:
      case: question
    assert:
      - type: equals
        value: answered
  - description: The verdict stays the same when the first model is exhausted
    vars:
      case: failover
    assert:
      - type: equals
        value: verified
  - description: An approve score passes
    vars:
      case: score-approve
    assert:
      - type: equals
        value: pass
  - description: A block score fails the bar
    vars:
      case: score-block
    assert:
      - type: equals
        value: fail
  - description: A thin transcript is reported separately and does not count as good work
    vars:
      case: score-thin
    assert:
      - type: equals
        value: insufficient_evidence
  - description: One run in ten is graded
    vars:
      case: sample
    assert:
      - type: equals
        value: yes
  - description: A redundant-test score proposes a builder instruction change
    vars:
      case: proposal
    assert:
      - type: contains
        value: stages/implement.md
      - type: contains
        value: does not change models.toml or max_review_rounds
      - type: contains
        value: A person opens the pull request.
  - description: Environment failure halts verify fast without wasting retries
    vars:
      case: verify-env-halt
    assert:
      - type: equals
        value: env_unavailable
  - description: Hard budget ceiling halts cleanly as budget_exceeded
    vars:
      case: budget-halt
    assert:
      - type: equals
        value: budget_exceeded
  - description: Scorer insufficient_evidence never passes and stays out of averages
    vars:
      case: scorer-insufficient
    assert:
      - type: equals
        value: insufficient_non_pass
  - description: Self-improvement write guard blocks protected config files
    vars:
      case: improve-write-guard
    assert:
      - type: equals
        value: blocked
  - description: Alert webhook creates redacted draft-only event
    vars:
      case: alert-webhook-draft
    assert:
      - type: equals
        value: draft_redacted
