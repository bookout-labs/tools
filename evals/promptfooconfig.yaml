# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: Delivery graph contract. No model is called.

prompts:
  - "{{case}}"

providers:
  - id: file://provider.py
    label: delivery-graph

tests:
  - description: A clear change is implemented and the check passes
    vars:
      case: clear
    assert:
      - type: equals
        value: verified
  - description: An approved spec is implemented
    vars:
      case: spec-ready
    assert:
      - type: equals
        value: verified
  - description: A small parent issue goes straight to implementation and stops verified
    vars:
      case: parent
    assert:
      - type: equals
        value: verified
  - description: A parent issue that needs a spec files its children
    vars:
      case: parent-spec
    assert:
      - type: equals
        value: children_filed
  - description: An open product choice stops for a person
    vars:
      case: spec-gate
    assert:
      - type: equals
        value: needs_human
  - description: A question is answered and does not change code
    vars:
      case: question
    assert:
      - type: equals
        value: answered
  - description: The verdict stays the same when the first model is exhausted
    vars:
      case: failover
    assert:
      - type: equals
        value: verified
  - description: A P1 needs one repair and the repeated advisory note permits merge
    vars:
      case: review-converges
    assert:
      - type: equals
        value: verified skipped edits=2 reports=2
  - description: Review falls back to the configured builder model after quota
    vars:
      case: review-fallback
    assert:
      - type: equals
        value: verified claude-opus-5-5-high,gpt-6.1-sol-high rounds=1 same_family=True reason=preceding_candidates_unavailable
