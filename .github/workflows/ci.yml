name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      FOREMAN_PINNED_SKILL_REPO: ${{ github.workspace }}/.pstack-pin
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: cursor/plugins
          ref: d42aff08aa58965d2735c4ead61a9af82b89d0d0
          path: .pstack-pin
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Record check shell
        run: |
          . /etc/os-release
          echo "$PRETTY_NAME"
          readlink -f /bin/sh
          dpkg-query -W dash
      - run: pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: sh evals/eval.sh
