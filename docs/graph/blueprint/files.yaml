pstack/skills/architect/SKILL.md:
  kind: skill
  description: Sketch types, signatures, and module structure before code, then stay
    in the loop while implementation fills in. Use for /architect, 'architect this',
    'design this', or non-trivial work where jumping to code would lock in the wrong
    shape.
  summary:
    Method steps: Trace affected systems and sketch two ownership shapes. (whole file)
  repository: cursor/plugins
  revision: d42aff08aa58965d2735c4ead61a9af82b89d0d0
  url: https://github.com/cursor/plugins/blob/d42aff08aa58965d2735c4ead61a9af82b89d0d0/pstack/skills/architect/SKILL.md
pstack/skills/benchmark-checklist/SKILL.md:
  kind: skill
  description: Vet a perf measurement (limiter, tuning, limits, errors, repeatability,
    relevance, and whether the work happened) before you report or act on it. Use
    when you run a benchmark or report a speedup or regression you measured.
  summary:
    Method steps: Verify benchmark conditions (whole file)
  repository: cursor/plugins
  revision: d42aff08aa58965d2735c4ead61a9af82b89d0d0
  url: https://github.com/cursor/plugins/blob/d42aff08aa58965d2735c4ead61a9af82b89d0d0/pstack/skills/benchmark-checklist/SKILL.md
pstack/skills/blast-radius/SKILL.md:
  kind: skill
  description: Find what a change could break somewhere else before it ships, beyond
    the diff, and prove the one fact it's safe because of by running real code instead
    of writing it up. Use for 'blast radius of X', 'what could this break', or reviewing
    a small diff you don't trust.
  summary:
    Method steps: Find the one fact the change is safe because of and what it breaks
      beyond the diff. (whole file)
  repository: cursor/plugins
  revision: d42aff08aa58965d2735c4ead61a9af82b89d0d0
  url: https://github.com/cursor/plugins/blob/d42aff08aa58965d2735c4ead61a9af82b89d0d0/pstack/skills/blast-radius/SKILL.md
pstack/skills/how/SKILL.md:
  kind: skill
  description: Use for "how does X work", code walkthroughs before changing something,
    and placement / ownership / layering questions ("where should this live", "which
    package owns this", "is this the right layer"). Explains subsystem architecture,
    runtime flow, onboarding mental models. Use why for motivation.
  summary:
    Method steps: Inspect the code and explain its architecture from source. (whole
      file)
  repository: cursor/plugins
  revision: d42aff08aa58965d2735c4ead61a9af82b89d0d0
  url: https://github.com/cursor/plugins/blob/d42aff08aa58965d2735c4ead61a9af82b89d0d0/pstack/skills/how/SKILL.md
pstack/skills/interrogate/SKILL.md:
  kind: skill
  description: Use for "interrogate", "adversarial review", "multi-model review",
    "challenge this", "stress test this code", "find blind spots", or "tear this apart".
    Adversaries try to break a change or design, and only findings proven by a run
    survive.
  summary:
    Method steps: Probe the candidate in one independent session and cite verified
      findings. (whole file)
  repository: cursor/plugins
  revision: d42aff08aa58965d2735c4ead61a9af82b89d0d0
  url: https://github.com/cursor/plugins/blob/d42aff08aa58965d2735c4ead61a9af82b89d0d0/pstack/skills/interrogate/SKILL.md
pstack/skills/statechart/SKILL.md:
  kind: skill
  description: Check a TLA+ model of a system that moves between states, such as a
    product flow, a protocol, or a service, and draw it as a Mermaid statechart. The
    report gives the shortest path to each state that breaks a rule. Use for /statechart,
    or to show a bug as a path through states.
  summary:
    Method steps: Describe state transitions and invariants. (whole file)
  repository: cursor/plugins
  revision: d42aff08aa58965d2735c4ead61a9af82b89d0d0
  url: https://github.com/cursor/plugins/blob/d42aff08aa58965d2735c4ead61a9af82b89d0d0/pstack/skills/statechart/SKILL.md
pstack/skills/tdd/SKILL.md:
  kind: skill
  description: Use only when the user explicitly asks for TDD, a failing test, or
    a regression test, OR when the bug has an obvious cheap local test target. Skip
    when the test path is unclear, expensive, integration-heavy, or not requested.
  summary:
    Method steps: Reproduce cheaply and rerun the focused regression check. (whole
      file)
  repository: cursor/plugins
  revision: d42aff08aa58965d2735c4ead61a9af82b89d0d0
  url: https://github.com/cursor/plugins/blob/d42aff08aa58965d2735c4ead61a9af82b89d0d0/pstack/skills/tdd/SKILL.md
pstack/skills/why/SKILL.md:
  kind: skill
  description: Use for 'why does X work this way', 'why we picked Y', design rationale,
    regressions, postmortems, or data-backed thresholds. Returns a cited read on decisions
    and tradeoffs. Use how for runtime behavior.
  summary:
    Method steps: Read author records and mark inferences. (whole file)
  repository: cursor/plugins
  revision: d42aff08aa58965d2735c4ead61a9af82b89d0d0
  url: https://github.com/cursor/plugins/blob/d42aff08aa58965d2735c4ead61a9af82b89d0d0/pstack/skills/why/SKILL.md
skills/engineering/diagnosing-bugs/SKILL.md:
  kind: skill
  description: Diagnosis loop for hard bugs and performance regressions. Use when
    the user says "diagnose"/"debug this", or reports something broken/throwing/failing/slow.
  summary:
    Method steps: Name a tight feedback loop that reproduces the bug before any hypothesis.
      (whole file) • Name a tight feedback loop that reproduces the regression before
      any hypothesis. (whole file)
  repository: mattpocock/skills
  revision: abeeaf95660ba9e8b7c753eb38f441ca707a8823
  url: https://github.com/mattpocock/skills/blob/abeeaf95660ba9e8b7c753eb38f441ca707a8823/skills/engineering/diagnosing-bugs/SKILL.md
skills/engineering/to-tickets/SKILL.md:
  kind: skill
  description: Break a plan, spec, or the current conversation into a set of tracer-bullet
    tickets, each declaring its blocking edges, published to the configured tracker
    (edges as text in one file per ticket locally, or native blocking links on a real
    tracker).
  summary:
    Method steps: Cut thin end-to-end slices and name each blocking edge. (whole file)
  repository: mattpocock/skills
  revision: abeeaf95660ba9e8b7c753eb38f441ca707a8823
  url: https://github.com/mattpocock/skills/blob/abeeaf95660ba9e8b7c753eb38f441ca707a8823/skills/engineering/to-tickets/SKILL.md
