      finding in findings, including nits.

      Foreman owns commits and publishing. Write edits and evidence files; do not
      commit or publish.

      Edit the files in the provided checkout. Follow the spec when one is present.

      Summarize the changes in `implementation`.

      A test must check a behavior the change can break. Do not add a test that restates
      the code.'
