schema_version: 1
blueprint_version: 3
status: approved
baseline: b96293d6e6403e854097cb8c2c3d94afe747e286
repositories:
  foreman_repository: bookout-labs/tools
  target_repository: Canonical repository of the admitted GitHub issue.
  target_checkout: Exclusive Git checkout of target_repository, with base revision pinned at admission.
  related_repositories: Read-only Git checkouts of the repositories the target contract names, each pinned at admission to its default-branch head and recorded on the run. Workers read them. Nothing writes to them.
  pstack:
    repository: cursor/plugins
    revision: d42aff08aa58965d2735c4ead61a9af82b89d0d0
    directory: pstack/skills
  matt_skills:
    repository: mattpocock/skills
    revision: abeeaf95660ba9e8b7c753eb38f441ca707a8823
    directory: skills
entry: triage
intake:
  trigger: Ready label added to an issue
  delivery: GitHub App webhook
  event: issue_labeled
  run_labels:
    ready: Show eligible work waiting to start.
    doing: Show the admitted run and its current stage.
    needs_answer: Show a saved question that requires the human's decision.
    stopped: Show an admitted run's halt with its name and evidence.
    done: Show a typed terminal result that is not a halt, such as merged, closed or cancelled.
  policy: >-
    Verify the App webhook and that the App is installed on the issue's repository, then read the current issue, repository and labels from GitHub.
    Admit only real issues that carry the Ready label in a repository that passes doctor's quick check. Check admission on a verified Ready label event,
    when merge.release starts a dependent that still carries Ready, when GitHub reports that a prerequisite issue no Foreman run owns has closed,
    whoever closed it, for each dependent that still carries Ready, or when merge.revert files a Ready revert issue. Ignore duplicate and stale
    deliveries and Foreman's own label updates. Reuse the per-issue checkpoint and lock. A Ready label added again to an issue whose run halted
    resumes its saved checkpoint at the halted step. Ready added to an issue whose run is open and not halted starts nothing and reads nothing. The run keeps its saved login and caps. The stop rule still counts from that Ready event, as drawn. Every start of a run, new or resumed, runs doctor's GitHub requirements first, in the runner, before the graph. The runner builds the run's human login and budget caps from that one read. For a new run the runner puts them in the run's starting state, so they are kept exactly when the run's checkpoint is kept. For a resume the runner replaces the saved values before the resumed stage runs. A wake or an answer that continues the run uses the saved values. It runs no doctor and reads no login or cap variable. The only repository variable read after a start is FOREMAN_MERGE_HOLD, which merge.arm reads each time it arms and doctor does not check. A failure starts or resumes nothing and reports not_ready with the missing requirement and its fix on the issue. The runner's not_ready is not a graph exit and not a saved halt. It writes only the issue's status comment, which shows not_ready and its fix in place of the checkpoint's state until the next start. The run label does not change. A new run keeps nothing. A resumed run keeps its checkpoint and its earlier halt, and resumes at its halted step when Ready is added again after the fix. Ready added to an issue whose run ended cancelled admits a new run. It starts at triage and leaves the cancelled run's closed PR and branch as they are. Mirror checkpoint state
    as one run label and one status comment with the typed result and its links. A halt before admission keeps the
    Ready label. Labels do not grant authority to merge or answer gates.
  settings: >-
    Works for organization and personal repositories (D6). A Project board is an optional view. An organization board
    can collect labeled issues with GitHub's built-in auto-add workflow.
  source: https://docs.warp.dev/factories/automation-triggers/
overview:
  framing: "Specific to issue delivery, shared through GitHub, and scrutinized with scorers, benchmarks and a scorecard for each run."
  source: https://web.archive.org/web/20261121015523/https://www.notion.com/a-new-shape-for-work
terminal_outcomes:
  answered: GitHub confirms the answer on the originating issue.
  children_filed: GitHub confirms the planned child issues and dependency links.
  merged: GitHub reports merged=true, the PR head SHA at merge equals the reviewed head, and the production check confirms the merge commit. Foreman records merge_commit_sha separately and admits eligible Ready dependents.
  reverted: The production check failed for Foreman's merge. Foreman filed a Ready revert issue for the merge commit and a regression issue with the evidence, and released no dependents.
  closed: GitHub confirms the pull request closed without a merge.
  cancelled: The human explicitly cancels at a human gate or posts a stop comment on the issue. Foreman closes the run's open PR, if any, with the cancellation. The close leaves the branch in place.
  no_change: On a first attempt the builder returned typed evidence that the acceptance already holds at the base. Foreman published nothing.
  halted: Foreman saves a named halt and its evidence.
evidence:
  introspection: [compiled node kind, owner binding, compiled edge and route label, procedure input fields, output schema and fields, model policy selector and dependency, prompt path, skill selector, declared halts and retries, owner module line budget]
  tests: [route priority and result typing, gate authority and continuation, effects, input provenance, identity, recovery, skill activation, checked tree identity, prompt assembly, readiness, protected files, acceptance test proof, mutation sample, production confirmation]
  review: [purpose, scope, prompt content, method quality, line budget choices, allowed dependencies, Warp fit, decisions]
  note: Resolve model order from the configured policy rather than duplicating model names. Behavioral scenarios verify effective fallback and family eligibility.

# The redesign brief in tools #299 (items 1-24) is the source of every change in blueprint v3. "Item N" in any rule means item N of that brief.
# The glossary defines item N and the owner's rulings merge B, verify A and rollback A.
target_contract:
  path: .foreman/contract.yaml
  purpose: >-
    One tracked file in target_repository holds everything that describes the repository to Foreman (item 22).
    It is versioned with the code it checks. It replaces the FOREMAN_CHECK variable, tools #292's .foreman/environment.yaml
    and the requirements that today are spread over the App install notes, cli.py, github.py, skill_rules.py and README.md.
  fields:
    check: "check: a string. The repository check command. Foreman runs it in the attempt container and requires exit 0 on an unchanged tree."
    test_report: "test_report: one relative path, or a list of them, inside the checkout, that the check command writes as JUnit XML. The files are generated and need not be tracked. The repository git-ignores them, so the check leaves the tree unchanged and they never enter the checked tree. An absolute path or one that leaves the checkout is rejected. Foreman removes them before each check run and reads only what that run wrote. Foreman reads each test case's ID and result from them without knowing the language. A test ID is the case's file made relative to the checkout root, empty when the report names none, its enclosing suite names, its classname and its name. Cases that share an ID are one test with a count: it passed only if every case passed, and a lower count than the base's is a missing test. The accepted tests are the IDs the base check run with the acceptance tests reports beyond the base's report. implement.tests uses them to prove the accepted tests are collected and fail at the base, and edit compares the test IDs in the reports at the base and the candidate to find a deleted or added skip (items 9 and 10)."
    image: "image: a string. The image of the attempt container, where every shell command of the builder, the acceptance test writer, the verifier and the reviewer runs (item 3)."
    setup: "setup: a list of strings. Setup commands that run in order in a fresh attempt container before any worker starts."
    network: "network: setup or run. setup is the default: the container reaches the network only during setup. run keeps it connected, for a repository whose app uses remote test services, such as a hosted test database or sign-in provider."
    start: "start: a map with command, the command that starts the app, health, a command that exits 0 once the app is up, and timeout_seconds, how long to wait for health."
    related_repositories: "related_repositories: a list of maps, each with repository as OWNER/NAME and start as the command that starts its service in the attempt container (item 4). The contract pins no commit. Admission pins each one for the run."
    secrets: "secrets: a list of names, each a valid environment variable name ([A-Z][A-Z0-9_]*). The secrets the app needs to start. Foreman supplies each one's test value from the Foreman host's environment variable FOREMAN_TEST_<NAME> as a variable of that name in the attempt container. Production credentials are never used. Foreman's redaction also removes each test value the run supplied from every text it writes to GitHub and to its run log."
    verify_skill: "verify_skill: a relative path under rules.paths that names a tracked regular file at the base. The repository's verify skill. The skill says how to start the app, how to sign in with a test account and what counts as evidence."
    mutation: "mutation: a map with command, the pinned mutation tool command, and sample_cap, the most changed lines the mutation check flips (item 15). Foreman gives the command the sampled changed lines as a file:line list on standard input, one per line. The command prints one JSON line for each mutation it made, with its file:line, an id the tool keeps the same across runs, and killed or survived. equivalent_mutations names a mutation by that id. Foreman stays language-neutral."
    production_check: "production_check: a map with command, a read-only command that confirms a merge commit in production, not_deployed_exit, an integer from 1 to 255, the exit code that means the commit is not deployed yet, and timeout_seconds, the time limit for production confirmation (item 20). Foreman runs the command with the merge commit SHA as its argument and no credentials in its environment. The command reads the deployed commit from a source that needs none, such as a public version endpoint the app serves or the commit its deploy reports publicly. It exits 0 when production runs the merge commit and the check passes, not_deployed_exit when production runs another commit, and any other code when the check failed. A repository with no deployment names a check of its default branch at the merge commit."
  field_rollout: >-
    A contract field becomes required in the build slice that first uses it. Until that slice ships, the contract parses and
    doctor passes without it.
  operator_variables: >-
    Repository variables keep only what the operator controls: FOREMAN_HUMAN_LOGIN, the GitHub login whose issue comments count as the
    human's, the budget caps FOREMAN_MAX_BUDGET_USD and FOREMAN_MAX_TOKENS, and FOREMAN_MERGE_HOLD.
    An unset FOREMAN_MAX_BUDGET_USD is 3 dollars (the owner's 2026-11-23 ruling, tools #26 comment 7111974499) and an unset FOREMAN_MAX_TOKENS is 20,000,000 tokens.
    Doctor requires that the FOREMAN_HUMAN_LOGIN account has write or admin permission on the repository, read from GitHub's repository permission for that user. A mistyped login or a stranger's stops the start, so no run begins that nobody can answer or stop.
  protected_files: [the check command, CI workflows under .github/workflows, the verify skill, accepted tests, the contract file]
  protected_rule: >-
    A feature run never changes a protected file (item 20). A change to one, other than a CI workflow, is filed as its own issue
    carrying Ready, and the feature that needs it depends on that issue. That issue gets its own Foreman run, whose candidate is
    checked by the check command and verify skill of the pinned base, unchanged, so a change never checks itself. Its merge.release
    starts the dependent feature as a new run. A CI workflow change is filed as its own issue without Ready. Foreman never builds it, because
    GitHub runs a PR's own workflow version and a published branch runs it before review. The coordinator or personal agent changes
    it outside Foreman, and when its issue closes, the dependent feature starts as a new run. The App holds no workflows permission, so GitHub
    rejects any push that changes a workflow file. A revert run is not a feature run (merge.revert).
  warp: {equivalent: Runner image and setup commands, factory repositories and secrets, page: https://docs.warp.dev/factories/runners/, also: [https://docs.warp.dev/factories/environments/, https://docs.warp.dev/factories/secrets/, https://docs.warp.dev/factories/guides/multi-repository-factory/], divergence: "Warp keeps the image, setup commands, repositories and secrets in the factory definition (runners/linux-build.yaml and factory.yaml in warp-factory-examples 02-sdlc-issue-to-pr). Foreman serves many target repositories from one installation, so each target repository carries its own contract, versioned with the code it checks."}
doctor:
  command: foreman doctor --repo OWNER/NAME
  purpose: >-
    Plain code that proves a target repository is ready (item 23). It replaces the start-time variable errors (cli.py:200, cli.py:203),
    Verify's no_skill route (review.py:72) and the missing label or merge queue found partway through a run. Its full part also runs
    the branch probe that merge_held waits on (item 19).
  quick:
    when: The command runs all of it. At every start of a run the runner (src/foreman/runner.py) runs the GitHub requirements before it enters the graph, so that check has no step or transition. Only a new run then runs the contract requirements, in triage.admit, after the stop read, the issue checks and the pin. The quick part reads GitHub and the contract file and starts no container.
    requirements:
      github: [the GitHub App is installed on the repository, "FOREMAN_HUMAN_LOGIN is set and not blank, and each budget cap that is set parses. An unset cap uses its default.", the FOREMAN_HUMAN_LOGIN account can write to the repository, the Ready label exists, a merge queue ruleset protects the base branch]
      contract: ["the contract file parses strictly, so an unknown or duplicate key is named, and validates", the verify skill exists at the contract's path]
  full:
    when: >-
      Run by the command after the quick part, and by triage.admit after the quick part whenever no green full check is recorded for
      the contract file's digest at the base, so a change to the contract file is checked once at the next admission. Each green
      full check is recorded in Foreman's run store on its host, keyed by repository and contract file digest. A failed full check
      stops admission with not_ready.
    requirements: [the contract image builds, the setup commands succeed, the check passes on the default branch, writes its test report and leaves the tree unchanged, the mutation command runs on the default branch, the production check command runs against the default branch head, the app starts and its health command answers, each related repository checks out at its default-branch head and its service starts, the synthetic branch probe shows that neither an outside writer nor the App can move a PR's source branch while its arm is open]
  failure: Every failure prints the one missing requirement and the exact fix. At a start it stops with not_ready, and no run starts or resumes.
  setup_page: >-
    docs/target-repo-setup.md lists each requirement, why Foreman needs it and how to supply it (item 24). It is generated from doctor's
    requirement list and a test fails if the two differ. App and engine are set up by ordinary PRs in those repositories with a green
    doctor as their acceptance test. No onboarding command is built until a third repository needs one.
  warp: {equivalent: Environment setup checks, page: https://docs.warp.dev/factories/environments/troubleshooting-environments/, divergence: "Warp reports environment_setup_failed when a run's setup fails. Foreman checks readiness at every start of a run, before any paid call, so a repository that is not ready never starts or resumes one."}
scorers:
  rule: >-
    Scorers read recorded work and never decide routes (item 21). Each scored run stores its label and reason with the run.
    Foreman records each escape on the run. An escape is closed by a change to the target repository's tests, verify skill or
    conventions, or to a Foreman prompt. It is never closed by a new guard in Foreman.
  when: >-
    After a run records its terminal result, Foreman scores it once with each scorer that has work to judge. When an escape is later
    recorded on the run, Foreman scores its review again. Scoring runs outside the stages and never changes the run's result. Scorers call workers through worker, not dispatch, so their spend stays outside the run's budget ledger, and the run report lists it.
  escape_input: >-
    Foreman records a revert and a failed production check itself. A hand fix reaches the run two ways. A commit on the PR's
    branch that the App did not make is recorded as a hand fix when Foreman next reads the PR. After the merge, an issue comment
    under the human's identity whose first line is foreman escape records one, with the comment as its evidence. The App's issue
    comment webhook delivers it to the issue's latest run.
  model: >-
    Each score is a fresh session on the next available qualified model under nodes.review in models.toml order, preferring a family
    that did not do the work it judges. A scorer that finds no available model leaves the score unknown.
  task_compliance: {judges: implement, question: "Did the merged PR deliver what the issue asked for, and only that? Judge scope from the issue text, not from the PR's description of itself.", labels: [compliant, partial, non_compliant]}
  review_quality: {judges: review, question: "Did each blocking finding carry a failing demonstration or a cited file:line, and did the review miss a defect that later escaped?", labels: [actionable, vague, empty_or_noise]}
  implementation: {module: src/foreman/scorers.py, entry: score_run, max_lines: 140, allowed_imports: [state, config, worker], never_does: [choose a route, change a run's result, add a guard to close an escape]}
  checks: {SR1: tests/test_scorers.py, SR2: tests/test_scorers.py, SR3: tests/test_scorers.py}
  scenarios:
    SR1: {given: A run that ended merged, expect: "Each scorer scores it once in a fresh session from a family that did not do the work it judges, and stores its label, reason and spend with the run. The run report lists that spend apart from the run's budget. The run's result and routes are unchanged."}
    SR2: {given: "A person's commit on the PR branch before merge, and a foreman escape comment under the human's identity after merge", expect: "Each is recorded on the run as a hand fix with its evidence, the review is scored again once for each, and the run's result stays merged. A foreman escape comment under another login records nothing."}
    SR3: {given: Every qualified review model is unavailable when a run ends, expect: The score is unknown and the run's result is recorded unchanged.}
  warp: {equivalent: Scorers, page: https://docs.warp.dev/factories/measure-and-improve/scorers/, divergence: "Same two scorers as scorers/task-compliance and scorers/review-quality in warp-factory-examples 02-sdlc-issue-to-pr. Foreman scores every run and feeds escapes, not only a sample."}
rules:
  routing: >-
    A step emits one typed outcome. CI checks that every value of each typed route enum has exactly one
    route in its router. A valid result therefore always has a route (D16). Use the transition order when checks overlap. Apply exit_normalization
    before returning from a stage, preserving the named halt and evidence.
    A stage result carries its typed outcome and artifact. The top router reads that outcome.
    A worker answer that fails output validation, its schema or the stage's own checks of it, gets one repair turn (item 1).
    Dispatch sends the exact validation error back into the same session once. A second invalid answer stops at dispatch with invalid_output.
  routing_source: https://docs.warp.dev/factories/blueprints/routes/
  exit_normalization: {foreign_repository: halted, exhausted: halted, not_ready: halted, unverified: halted}
  gates:
    continuation: >-
      The coordinator or personal agent relays the question and posts the answer or cancellation on
      the issue under the human's identity.
      Only an answer to the open question continues the run. Silence keeps the gate open.
      An unrelated reply does not count. Gates are only for unresolved questions.
      Plan approval never waits on the human.
      The human's identity is the GitHub login saved on the run, which the runner read from FOREMAN_HUMAN_LOGIN at the run's last start. A stop is an issue comment under that login whose
      first line is foreman stop (item 8). A stop counts only when its comment was created after Ready was last added to the issue. Adding Ready again asks for the run again, so an older stop no longer applies. Both times come from GitHub. An edit to an older comment does not make it a new stop. Each stage's first step reads the issue for a stop before it makes a paid call or a write,
      and a stop ends the run cancelled. At a start, doctor's GitHub requirements come before that read. On a new run they come before admit's read. On a resume they come before the read the resumed stage makes when it is re-entered. A not_ready report is the only write that can come first. The App's issue comment webhook wakes a waiting run when the human posts a stop. The read is built once in src/foreman/steps/__init__.py. A first step that calls a worker,
      as research.answer, spec.draft, verify.drive and review.inspect do, makes it before the call.
    checkpoint: Save the question, its exact issue or artifact identity, and the human's answer from the issue comment. Every gate, review's included, posts its reply marker on the issue (item 18). Explicit cancellation for that question emits cancelled.
  prompts: Load the target prompt as the complete worker instructions and supply the declared run context separately. Deploy the prompt by replacing the runtime file.
  skills: Load each skill whole at its pinned commit (item 5). No skill is cut to a line range.
  publication_halt: publication_unreconciled
  paths: >-
    A slice's file list is advisory (item 6). Each listed existing path must name a Git-tracked regular file in the pinned
    target_checkout tree. A listed path may be absent when the slice adds the file. Reject absolute paths, traversal, directories
    and symlinks. An assumption's citation names a Git-tracked regular file in a related repository checkout at its pinned commit.
  reporting: >-
    Each terminal result includes issue, blueprint version, furthest stage, saved evidence, known work and raw tokens,
    Claude spend where known and rounds. Foreman records each escape on the run (item 21): a hand fix, a revert or a failed
    production check, with its evidence and the change that closed it. It also lists each scorer's spend, kept apart from the run's budget.
    Unsupported metrics are unknown.
context:
  - [GitHub checks, GitHub merge queue, Enforces repository rules]
  - [GitHub merge queue, Foreman, Reports the merge result]
  - [Human, Coordinator or personal agent, Work and decisions]
  - [Coordinator or personal agent, GitHub issue, Files and comments for the human]
  - [Foreman, Coordinator or personal agent, Gate questions]
  - [GitHub issue, Foreman, "Ready label, work, repository identity, and comments"]
  - [Foreman, GitHub issue, Run label and status comment]
  - [CARR record layer, T3 Code, Authorized team context]
  - [T3 Code, Coordinator or personal agent, Conversation context]
  - [Foreman, Attempt container, Builds the contract image and runs setup]
  - [Worker CLIs, Attempt container, "Shell commands only, routed into the container, never on the host"]
  - [Foreman, Worker CLIs, Assigns a bounded procedure]
  - [Worker CLIs, Target checkout, Reads or edits within assignment]
  - [Worker CLIs, Related repository checkouts, Read only at pinned commits]
  - [Foreman, GitHub pull request, Publishes checked changes]
  - [Foreman, Production, Runs the read-only production check]
workers:
  coordinator:
    title: Investigate and plan
    steps: [triage.route, research.answer, spec.draft]
    method: Inspect the repository or issue assigned to the run and report a typed route, sourced answer or candidate. A plan cites each fact it relies on outside the target checkout.
    permissions: Read the issue, the pinned target_checkout and the related repository checkouts (item 4).
    conversation: Use a fresh assignment with saved questions and candidate evidence when revising.
  checker:
    title: Challenge the plan
    steps: [spec.check]
    method: Probe issue fit, each slice and each cited assumption in the target and related repositories, including when both repositories contain the named path. An outside fact the plan relies on without listing it, or a not-drivable mark without a sound reason, is a finding.
    permissions: Read pinned target_checkout, the related repository checkouts and the exact candidate. Return typed findings.
    conversation: Use a fresh independent session per candidate, with a qualified different family preferred.
  builder:
    title: Build and check the change
    steps: [implement.edit]
    method: >-
      Edit within acceptance, run the contract's check command and the accepted tests in the attempt container and report the result (item 3).
      If the code contradicts a fact in the plan, ask through implement's question gate instead of building it (item 11).
      Report that no change is needed only as typed no_change evidence on a first attempt: the checks showing the acceptance already holds at the base and what they showed (item 12).
      For a surviving mutation, add a test that notices it or answer that it is equivalent, with the reason no test can notice it.
    permissions: >-
      Write the exclusive target_checkout and its attempt scratch inside the attempt container, except the accepted tests and the
      protected files (item 10). The container can start the app and its related services. Read the related repository checkouts.
      Foreman commits and publishes.
    conversation: >-
      Keep one conversation for the life of the PR (D5, item 2). Dispatch saves the native session on every accepted answer.
      A failed check, a failed criterion, a review finding or a merge repair resumes it when the checkout fingerprint matches the
      saved one. Otherwise start fresh from durable artifacts after reconciliation.
  verifier:
    title: Prove the change independently
    steps: [implement.tests, verify.drive]
    method: >-
      At implement.tests, write acceptance tests and fixtures from the plan and the base tree before any build, for each criterion proven by test or contract (item 9).
      At verify.drive, build and start the app at the exact published head with the target repository's own verify skill,
      drive the changed flow and report each acceptance criterion as passed, failed or unverified with evidence. A contract
      criterion runs against the related repository's real service or its recorded contract at the pinned commit (item 13).
    permissions: >-
      Run shell commands in the attempt container and read the related repository checkouts. At implement.tests, write only test and fixture files
      in the exclusive target_checkout. At verify.drive, run the app at the published head with test values for the contract's
      secrets and test accounts, read-only, and write captures and scratch files to its attempt scratch. No source edits, commits,
      pushes, approvals or merges. Foreman keeps the accepted tests for the build and posts the report.
    conversation: Start a fresh session for every assignment. Prefer a qualified model from a different family from the builders. If none is available, use the next available qualified model in models.toml order, including the builder's family.
  reviewer:
    title: Review the full change
    steps: [review.inspect]
    method: Review the complete current PR in three fresh passes, each answering one fixed question, and cite each finding (item 17).
    permissions: >-
      Read the exact PR head and diff base through the one granted diff command, and read the related repository checkouts (item 16).
      Run the contract's check command in the attempt container. Return each demonstration in the finding. Foreman writes and runs it and posts the report.
    conversation: Start a fresh session for every pass of every round. Prefer a qualified model family that did not build the change when one is available. Use the next available qualified model in models.toml order when needed, including the builder's family.

stages:
  triage:
    title: Route the issue
    purpose: Choose research or planning for one admitted issue.
    scope: Read target_repository issue and dependencies. Update the issue's run label and status comment. No repository edits or PR writes.
    entry: "A new run that the runner started: on a verified Ready label event, for a dependent that still carries Ready when merge.release starts it or when a prerequisite issue closes, or for a Ready revert issue that merge.revert filed. A saved answer resumes the route step."
    worker: coordinator
    model_policy: nodes.triage
    instructions:
      prompt: docs/graph/blueprint/prompts/triage.md
      runtime_prompt: src/foreman/stages/triage.md
      context: [Canonical repository and pinned base, related repository checkouts, unresolved intent and saved answer]
    skills: []
    inputs:
      run: Intake supplies canonical repo and issue, required for every admission.
      plan: GitHub supplies stored slice and dependencies for existing child issues.
      contract: The target contract at the pinned base, read by doctor's quick check, required.
      human_answers: On resume, Foreman supplies the saved answer the agent posted on the issue under the human's identity.
    outputs:
      schema: foreman.stage_output.TriageOutput
      fields: [human_question, slice, triage, work_kind]
      consumers: [research, spec]
      outcomes: {question: Answer the bounded question, plan: Draft a plan, supplied_slice: Validate the supplied slice, needs_human: Ask the human for missing intent, cancelled: Report cancellation, halted: Report failed admission}
    steps:
      admit:
        actor: Foreman
        action: Read the issue for a stop, validate the issue and prerequisites, then pin the base and check the contract
        result: Canonical issue identity, pinned base and a passed contract check, a stop, or not_ready
        owner: admit
        check: TR1
      route:
        actor: Triage worker
        action: Classify the admitted issue
        result: Typed route and supplied slice when present
        owner: route
        check: TR2
    transitions:
      - [__start__, admit, null]
      - [admit, route, admitted]
      - [admit, __end__, not_ready]
      - [admit, __end__, cancelled]
      - [admit, __end__, halted]
      - [route, __end__, question]
      - [route, __end__, plan]
      - [route, __end__, supplied_slice]
      - [route, __end__, cancelled]
      - [route, __end__, halted]
    exits: {question: research, plan: spec, supplied_slice: spec, cancelled: __end__, halted: __end__}
    gates:
      - {answerer: Human, question: Decide the missing issue intent, accepted: answer or cancel, saved: Issue-bound answer, resume: route, bullets: [Clarify issue intent, Answer or cancel, Resume triage]}
    effects: [Foreman reads GitHub and saves admission and route records., Foreman uses the GitHub adapter to mirror checkpoint state as the issue's run label and status comment.]
    invariants:
      - GitHub repository identity and run configuration agree.
      - Open dependencies prevent admission and later eligibility is read from GitHub.
      - The runner has already run doctor's GitHub requirements and built the run's login and caps from that read, so admit starts with the stop read. It then validates the issue and its prerequisites, pins the base, and runs doctor's contract requirements and its full check when the contract file's digest has no green record, before any paid call (item 23). A repository that fails either starts no run, and the halt names the one missing requirement and its exact fix. Before the stop read Foreman makes no paid call and writes nothing except a not_ready report. A wrong repository or an open dependency stops before the base is pinned, so no build checkout is allocated (TR1).
      - admit accepts a slice of kind revert only when the App filed the issue, its saved marker matches a revert recorded on a Foreman run, and its merge_commit_sha is that run's merge commit. Any other issue carrying kind revert stops invalid_output.
    failure_and_resume:
      halts: [missing_slice, skill_missing, invalid_output, git_failed, not_ready]
      retries: {}
      recovery: A failed contract requirement or full check stops admission with not_ready. A failed GitHub requirement stops the start in the runner, before triage, with the same report. Supply the named requirement, then remove and add Ready. On a resume the checkpoint is kept, not deleted. A new run's not_ready keeps Ready, so remove and add it after the fix. A resumed run's not_ready leaves the run halted under its Stopped label, so add Ready again after the fix. The not_ready report names which. A halt before admission keeps Ready, so only a new label event checks admission again. Missing child payload stops admission. A pstack pin that can't be fetched or exported stops admission with skill_missing, an issue whose identity differs from the assignment or a revert slice that fails the revert check with invalid_output, and a GitHub or checkout failure with git_failed. An open dependency leaves the issue unadmitted. Worker dispatch failures use shared dispatch. The human's answer resumes route.
    implementation: {module: src/foreman/steps/triage.py, entry: compile_stage, max_lines: 110, allowed_imports: [state, stage_output, github, dispatch, doctor], shared: [Forge, dispatch], never_does: [create child issues, edit source]}
    checks: {TR1: tests/test_runner.py, TR2: tests/test_delivery.py, TR3: tests/test_accept.py, TR4: tests/test_doctor.py, TR5: tests/test_doctor.py, TR6: tests/test_runner.py, TR7: tests/test_doctor.py, TR8: tests/test_accept.py, TR9: tests/test_start.py, TR10: tests/test_runner.py, TR11: tests/test_start.py, TR12: tests/test_doctor.py}
    scenarios:
      TR1: {given: The requested issue names another repository or a dependency is still open, expect: Stop before a paid call or build checkout allocation.}
      TR2: {given: A parent-labelled question and a separately supplied single slice, expect: Route the question to research and the supplied slice to spec.validate.}
      TR3: {given: A verified Ready label event arrives twice and the App adds the Doing label, expect: One admitted checkpoint and one run with the issue showing its state.}
      TR4: {given: "A scratch repository with each quick requirement removed in turn: App install, FOREMAN_HUMAN_LOGIN unset or blank, or a cap that won't parse, the login's write access, Ready label, merge queue ruleset, contract file, verify skill", expect: "Doctor names the missing requirement and its exact fix each time."}
      TR7: {given: "A contract file change at the base, once with a passing full check and once with a failing check command", expect: "The next admission runs the full check once and records it green before admitting. The failing one stops not_ready naming the check, and no run or paid call starts."}
      TR5: {given: docs/target-repo-setup.md and doctor's requirement list differ by one requirement, expect: The page test fails.}
      TR6: {given: "A foreman stop comment under the human's identity, and one under another login, posted while a run waits between stages, and the human later removes and adds Ready", expect: "The next stage entry ends the run cancelled before any paid call. The comment under another login changes nothing. The run that the new Ready event starts or resumes ignores the earlier stop. A stop posted after that event cancels it."}
      TR8: {given: "A Ready revert issue that merge.revert filed, and issues carrying a revert slice that a person filed, whose marker matches no recorded revert, or whose merge_commit_sha is not that run's merge commit", expect: "Admit the App's revert issue. Each other one stops invalid_output before any paid call or build checkout."}
      TR9: {given: "A run halted budget_exceeded, the operator sets FOREMAN_MAX_BUDGET_USD to 4.5o and adds Ready, then corrects it and adds Ready again", expect: "The first start reports not_ready naming the variable and its fix, makes no paid call and keeps the checkpoint and its budget_exceeded halt. The second resumes at the interrupted step within the corrected cap."}
      TR10: {given: "FOREMAN_HUMAN_LOGIN and FOREMAN_MAX_BUDGET_USD change while a run waits for an answer, and the run then continues", expect: "The answer and stop reads use the login saved at the start, and dispatch uses the saved caps."}
      TR11: {given: "A new run's start in a repository missing a GitHub requirement, and one missing a contract requirement", expect: "The first stops in the runner before the graph and the second in triage.admit. Each reports not_ready on the issue, keeps Ready and starts no run or paid call."}
      TR12: {given: "FOREMAN_HUMAN_LOGIN set to a login GitHub does not know, and to an account with only read access", expect: "Doctor names the requirement each time. Its fix says to correct the login's spelling, or to give the account write access or name another login."}
    decisions: [D3, D6, D9, D14]
    warp: {equivalent: Intake and conditional triage, page: https://docs.warp.dev/factories/how-factories-work/, also: [https://docs.warp.dev/factories/environments/troubleshooting-environments/], divergence: "Foreman binds GitHub issue and dependency identity before classification to prevent cross-repository work. Warp finds a setup failure when a run's environment starts. Foreman checks readiness before any paid call: the runner runs doctor's GitHub requirements before the graph, and admit runs its contract requirements at the pinned base."}

  research:
