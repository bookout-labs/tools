    skills:
      - {ref: how/SKILL.md, when: always, kind: leaf_prompt, lines: null, method: Inspect the code and explain its architecture from source.}
      - {ref: why/SKILL.md, when: bug_fix, kind: skill, lines: null, method: Read author records and mark inferences.}
      - {ref: engineering/diagnosing-bugs/SKILL.md, repository: matt_skills, when: bug_fix, kind: skill, lines: null, method: Name a tight feedback loop that reproduces the bug before any hypothesis.}
      - {ref: engineering/diagnosing-bugs/SKILL.md, repository: matt_skills, when: perf_issue, kind: skill, lines: null, method: Name a tight feedback loop that reproduces the regression before any hypothesis.}
    inputs:
      run: Triage supplies origin issue, repository, base and question, required.
      human_answers: On resume, Foreman supplies the saved source or clarification the agent posted on the issue under the human's identity.
      plan: Triage supplies work kind, required for skill selection.
    outputs:
      schema: foreman.stage_output.ResearchOutput
      fields: [research, human_question]
      consumers: [origin issue, operator]
      outcomes: {answered: Origin issue has the saved answer, cancelled: The human cancelled, halted: Delivery stopped with evidence}
    steps:
      answer: {actor: Research worker, action: Return a sourced answer, result: "Typed answer for the pinned base, or a stop that Foreman read before the call", owner: answer, check: RE2}
      post: {actor: Foreman, action: Post the saved answer, result: Observed issue comment, owner: post, check: RE1}
    transitions:
      - [__start__, answer, null]
      - [answer, post, answer]
      - [answer, __end__, cancelled]
      - [answer, __end__, halted]
      - [post, __end__, answered]
      - [post, __end__, halted]
    exits: {answered: __end__, cancelled: __end__, halted: __end__}
    gates:
      - {answerer: Human, question: Provide the missing external source or clarify the question, accepted: source or answer or cancel, saved: Issue-bound answer, resume: answer, bullets: [Supply missing source, Clarify or cancel, Resume research]}
    effects: [Foreman posts an issue comment keyed by run and answer digest.]
    invariants: [The worker reads the named repository and cites source evidence., Publication cannot allocate a PR., Each skill loads whole at its pinned commit.]
    failure_and_resume:
      halts: [git_failed, publication_unreconciled]
      retries: {}
      recovery: At post read the origin issue for the saved marker before another write. Adopt the matching comment. If the write remains ambiguous, stop with publication_unreconciled. Dispatch owns worker failures.
    implementation: {module: src/foreman/steps/research.py, entry: compile_stage, max_lines: 85, allowed_imports: [stage_output, github, dispatch], shared: [Forge, dispatch], never_does: [edit source, file child issues]}
    checks: {RE1: tests/test_delivery.py, RE2: tests/test_delivery.py, RE3: tests/test_delivery.py, RE4: tests/test_skill_rules.py}
    scenarios:
      RE1: {given: GitHub accepts the answer before the checkpoint fails, expect: Adopt the matching comment once or report publication_unreconciled if the prior write cannot be confirmed.}
      RE2: {given: A question about a revision-sensitive symbol, expect: Return a cited answer from the pinned target base and open no PR.}
      RE3: {given: The answer needs external evidence absent from the issue and pinned checkout, expect: Pause before posting and resume answer with the human’s clarification.}
      RE4: {given: A worker method names a pinned pstack skill, expect: "The instructions tell the worker to read the whole SKILL.md at the pinned commit, with no line range."}
    decisions: [D7]
    warp: {equivalent: Research and answer, page: https://docs.warp.dev/factories/factory-agents/, also: [https://docs.warp.dev/factories/factory-skills/], divergence: "Foreman confirms one issue comment because the source is GitHub. Skills load whole at a pinned commit, as Warp loads a SKILL.md."}

  spec:
    title: Plan and check the work
    purpose: Clear an exact repository-bound candidate that states behavior, or file its linked child issues.
    scope: Read-only target_checkout at pinned base and the related repository checkouts until filing. GitHub child writes stay in target_repository.
    entry: Triage requests a draft or supplies a slice for common validation. Revisions stay within this stage.
    worker: coordinator
    model_policy: nodes.spec
    instructions:
      prompt: docs/graph/blueprint/prompts/spec.md
      runtime_prompt: src/foreman/stages/spec.md
      context: [Canonical repository and pinned base, related repository checkouts, prior candidate and findings, the human's saved answer]
    skills:
      - {ref: architect/SKILL.md, when: always, kind: skill, lines: null, method: Trace affected systems and sketch two ownership shapes.}
      - {ref: statechart/SKILL.md, when: stateful, kind: skill, lines: null, method: Describe state transitions and invariants.}
      - {ref: engineering/to-tickets/SKILL.md, repository: matt_skills, when: parent, kind: skill, lines: null, method: Cut thin end-to-end slices and name each blocking edge.}
    inputs:
      run: Triage supplies canonical issue, target repository and pinned base, required.
      plan: Triage supplies a stored slice, or spec supplies a draft and bound prior findings for revision.
      human_answers: Foreman reads clarifications, comments and answers the agent posts on the issue under the human's identity.
    outputs:
      schema: foreman.stage_output.SpecOutput
      fields: [assumptions, questions, slices, spec, spec_gate]
      consumers: [implement, child issue runs, operator]
      outcomes: {ready: Worker supplied a candidate for validation, needs_human: The human must answer grounded questions, validated_single: One candidate slice cleared both checks, children_filed: All children and links confirmed, cancelled: The human cancelled, halted: Planning stopped}
    steps:
      draft: {actor: Spec worker, action: Draft behavior slices with a cited assumptions list, result: "Candidate with acceptance criteria, non-goals, a proof for each criterion and cited assumptions, grounded questions, or a stop that Foreman read before the call", owner: draft, check: SP1}
      validate: {actor: Foreman, action: "Read the issue for a stop, then validate repository, file list, proofs and assumption citations", result: "Ordered exact candidate, typed defect or a stop", owner: validate, check: SC1}
      check: {actor: Independent checker, action: Check and approve the plan, result: Model approval or findings for the checked candidate, owner: check, check: SC2}
      file_children: {actor: Foreman, action: File and link child issues, result: Observed children and dependency links, owner: file_children, check: FS1}
    transitions:
      - [__start__, validate, supplied_slice]
      - [__start__, draft, plan]
      - [draft, validate, ready]
      - [draft, __end__, cancelled]
      - [draft, __end__, halted]
      - [validate, __end__, foreign_repository]
      - [validate, __end__, exhausted]
      - [validate, __end__, cancelled]
      - [validate, draft, repair]
      - [validate, check, valid]
      - [check, __end__, exhausted]
      - [check, draft, changes]
      - [check, __end__, cancelled]
      - [check, __end__, validated_single]
      - [check, file_children, validated_parent]
      - [check, __end__, halted]
      - [file_children, __end__, children_filed]
      - [file_children, __end__, halted]
    exits: {validated_single: implement, children_filed: __end__, cancelled: __end__, halted: __end__}
    gates:
      - {answerer: Human, question: "Decide the unresolved product, repository, architecture or policy choice, or confirm a fact the plan cannot cite", accepted: explicit choice or cancel, saved: Answer scoped to the candidate and choice, resume: draft, bullets: [Resolve planning choice, Choose or cancel, Resume drafting]}
      - {answerer: Human, question: Resolve an intent choice identified by the independent checker, accepted: explicit choice or cancel, saved: A settled ruling for the issue. Later candidates are checked with it as context., resume: check, bullets: [Resolve checker question, Choose or cancel, Resume plan check]}
    effects: [Foreman saves draft and verdict by candidate revision., Only file_children creates or adopts child issues and links by stable parent issue and slice marker.]
    invariants:
      - The candidate digest binds target_repository, pinned base, issue and approved content scope. A changed digest needs fresh validation and checking.
      - Validate explicit repository and path identity before a paid plan check. The checker independently assesses ambiguous issue intent and repository ownership. The foreign-repository rejection stays for write scope (item 4). A slice whose changes belong in another repository, a related repository included, stops with foreign_repository. Related repositories are read roots only.
      - A slice states observable behavior (item 6). It gives acceptance criteria, non-goals and how each criterion is proven, by test, drive or contract. A test or contract proof names behavior the base lacks, so its acceptance test can fail at the base. A criterion the base already meets, as in a refactor or a perf slice, is proven by drive. A drive criterion that cannot be driven says so with a reason. A slice never names a code edit. It keeps depends_on for its parents and an advisory list of files it expects to touch. A slice lists each existing test it removes or renames, with the reason. The checker rules on that list. Slices have no builds or uses seams.
        A slice's kind is feature, revert or protected. Only merge.revert sets revert, and a revert slice also carries the
        merge_commit_sha it undoes. The spec worker's output schema cannot emit revert. Slice titles are unique. Dependencies are acyclic.
      - The candidate carries an assumptions list (item 7). Each fact the plan relies on outside target_checkout cites a Git-tracked file in a related repository checkout at its pinned commit, or becomes a grounded gate question. Validate rejects an uncited assumption as a typed defect and returns the candidate to draft. A contract criterion names the related repository and the assumption it proves.
      - The independent model checker can approve the plan after validation. ready is the drafter's claim of completeness.
      - The plan proceeds when the validator and the model check clear it, without the human's review. The human may comment through their coordinator or personal agent. A foreman stop comment under the human's identity ends the run cancelled at the next stage entry (item 8). Spec keeps no digest approval. A separate clarification gate only asks the human to resolve an open choice.
      - A plan that needs a change to a protected file of the target contract is a parent plan, even when it has one feature slice (item 20). The protected change is its own slice of kind protected, filed as a child issue, and the feature slice depends on it. A CI workflow slice is filed without Ready. Every other protected slice carries Ready. Check routes the plan validated_parent to file_children, and a protected child carrying Ready runs first through its own Foreman run.
      - File children from the cleared candidate only. Adoption verifies marker, repository, parent, body and links. Release only eligible children.
      - Validate checks what the slice schema shows, such as a criterion without its proof, a builds or uses field, or an uncited assumption. Whether a slice's prose dictates a code edit is the checker's finding, guided by the spec prompt.
    failure_and_resume:
      halts: [invalid_output, spec_cap, git_failed, publication_unreconciled]
      retries: {plan_revisions: src/foreman/models.toml#max_review_rounds}
      recovery: Explicit foreign scope reports invalid_output before the checker. Spec's plan revisions, implement's failed checks and review's blocking rounds each count separately against max_review_rounds. Other candidate defects, an uncited assumption included, save evidence, count each rejected digest once, and return to draft only while rejections remain below max_review_rounds. Dispatch reconciles paid calls before any repeat. At file_children, inspect the issue marker and links before repeating an ambiguous write. If the outcome stays ambiguous, stop with publication_unreconciled.
    implementation: {module: src/foreman/steps/spec.py, entry: compile_stage, max_lines: 410, allowed_imports: [state, stage_output, github, dispatch, spec_check, workspace], shared: [Forge, Workspace, dispatch], never_does: [edit source, choose a replacement target repository, dictate a code edit]}
    checks: {SP1: tests/test_spec_candidate.py, SP2: tests/test_spec_candidate.py, SP3: tests/test_spec_candidate.py, SP4: tests/test_spec_candidate.py, SC1: tests/test_spec_check.py, SC2: tests/test_spec_check.py, SC3: tests/test_spec_check.py, SC4: tests/test_spec_check.py, SC5: tests/test_spec_check.py, SC6: tests/test_spec_check.py, SC7: tests/test_spec_check.py, FS1: tests/test_runner.py}
    scenarios:
      SP1: {given: The issue names a file also present in Foreman's installation, expect: Brief names target_repository and pinned target_checkout.}
      SP2: {given: Valid typed draft, expect: "Save one digest scoped to issue, base and repo before independent check."}
      SP3: {given: A draft whose slice leaves a criterion without its proof or carries a builds or uses field, expect: Validate returns it to draft as a typed defect before any checker call.}
      SP4: {given: "Replayed app #1375: the plan relies on an engine route outside the app checkout", expect: "The draft cites the engine route file in the pinned related checkout or asks a grounded question. Seeded with the uncited wrong assumption, validate rejects it before any checker call."}
      SC1: {given: A slice names a foreign repository or a file available only in foreman_repository, expect: Explicit mismatch stops and wrong root rejects before any builder call.}
      SC2: {given: Synthetic wrong-repository issue with matching file names in both repositories, expect: Checker rejects implied foreign intent and no build or child filing occurs.}
      SC3: {given: The human answers a choice on candidate A then candidate B changes scope, expect: Validate and check B with settled rulings as context. Ask again only a choice they don't settle.}
      SC4: {given: A listed path that is a directory or symlink or cyclic parent dependencies, expect: Common validator rejects both and the final allowed rejection reports spec_cap.}
      SC5: {given: The model clears a validated plan with no human response, expect: Proceed without a manual approval step. A foreman stop comment under the human's identity ends the run cancelled before implementing or filing.}
      SC6: {given: A one-slice plan that needs a change to the repository's check command, expect: "The plan becomes a parent with the check command change as its own slice. Check routes it validated_parent and file_children files that slice with Ready and the feature with a dependency on it. The check command change runs as its own run, checked by the base's unchanged check, and its merge admits the feature."}
      SC7: {given: A validated slice whose acceptance dictates the exact code expression to write, expect: The checker returns a finding that the slice names a code edit and the candidate goes back to draft.}
      FS1: {given: A child issue or link write times out, expect: Adopt the matching result once and complete missing links. Report publication_unreconciled if the write cannot be confirmed.}
    decisions: [D3, D7, D8, D9]
    warp: {equivalent: Planning and plan gate, page: https://docs.warp.dev/factories/blueprints/gates/, divergence: "Foreman validates repository, file list and assumption citations deterministically. The independent model checker can approve the plan and the human's review is optional. A checker's intent answer settles the issue, not one plan revision. Warp's gates page re-asks only approval for a revised plan. Warp's spec agent states desired behavior, non-goals and validation criteria (agents/spec in 02-sdlc-issue-to-pr). Foreman adds a cited assumptions list because a planner that cannot read a dependency guesses its API (app #1067)."}

  implement:
    title: Build and publish the change
    purpose: Publish exactly the tree that passed the repository check, the accepted tests and the mutation check.
    scope: Exclusive target_checkout inside the attempt container, the related repository checkouts read-only, candidate issue, attempt parent, owned branch and matching PR. No direct base-branch writes.
    entry: Spec clears one slice, verify reports a failed criterion or a moved head, review reports a blocking finding or a moved head, or merge returns a verified repair route.
    worker: builder
    model_policy: nodes.implement
    instructions:
      prompt: docs/graph/blueprint/prompts/implement.md
      runtime_prompt: src/foreman/stages/implement.md
      context: [Candidate and acceptance, assumptions, accepted tests, existing PR and head, exact repository checks, blocking repair evidence, failed criteria, surviving mutations]
    skills:
      - {ref: tdd/SKILL.md, when: bug_fix, kind: skill, lines: null, method: Reproduce cheaply and rerun the focused regression check.}
      - {ref: benchmark-checklist/SKILL.md, when: perf_issue, kind: skill, lines: null, method: Verify benchmark conditions, result and relevance.}
      - {ref: formal-<area>/SKILL.md, repository: target_repository, when: always, kind: target_skill, lines: null, method: "When the target repository has its own formal verification skill, created by pstack create-formal-verification-skill, run its check on any change that touches the verified code. When the change is intended, update the verification with maintain-formal-verification-skill."}
    inputs:
      run: Intake supplies issue, repo and pinned base, required.
      plan: Spec supplies one cleared slice, its assumptions and matching candidate revision, required.
      work: Prepare supplies the attempt container, exclusive checkout, branch and pinned attempt parent before edit.
      checks: The target contract at the pinned base supplies the check command, image, setup and mutation command, required.
      review: Review or merge supplies PR-bound repair evidence, conditional.
      verify: Verify supplies failed criteria and their evidence, conditional.
    outputs:
      schema: foreman.stage_output.ImplementOutput
      fields: [implementation, no_change, human_question, equivalent_mutations]
      consumers: [verify, review, operator]
      outcomes: {published: Confirmed PR at checked head, no_change: Typed builder evidence that the acceptance already holds, cancelled: The human cancelled, halted: No valid checked publication}
    steps:
      prepare: {actor: Foreman, action: "Read the issue for a stop, then prepare the attempt container, reconcile the worktree and run the check at the base", result: "Trusted checkout, attempt parent, a container built from the contract image and setup and the base's report, or a stop", owner: prepare, check: IM1}
      tests: {actor: Acceptance test writer, action: Write acceptance tests from the plan and the base tree, result: "Accepted tests that the check collects and that fail at the base, or the exact evidence against them", owner: tests, check: IM5}
      edit: {actor: Builder, action: Edit and run the check with the accepted tests, result: "Checked candidate tree, exact command failure, the weakened checks as findings, typed no_change evidence that no change is justified, or the shared optional human_question for the acceptance gate", owner: edit, check: IM2}
      mutate: {actor: Foreman, action: Mutate a capped sample of changed lines, result: "Every sampled mutation fails a test, or the surviving mutations as findings", owner: mutate, check: IM6}
      commit: {actor: Foreman, action: Commit or adopt the checked tree, result: Exact commit with tested tree, owner: commit, check: IM4}
      publish: {actor: Foreman, action: Publish the checked commit, result: "Confirmed repository, PR, branch, base and head", owner: publish, check: PU2}
    transitions:
      - [__start__, prepare, null]
      - [prepare, __end__, cancelled]
      - [prepare, __end__, halted]
      - [prepare, tests, needs_tests]
      - [prepare, edit, prepared]
      - [tests, __end__, halted]
      - [tests, tests, tests_rejected]
      - [tests, edit, tests_accepted]
      - [edit, __end__, cancelled]
      - [edit, __end__, no_change]
      - [edit, __end__, halted]
      - [edit, edit, check_failed]
      - [edit, edit, checks_weakened]
      - [edit, mutate, checked]
      - [mutate, __end__, halted]
      - [mutate, edit, mutation_survived]
      - [mutate, commit, mutations_caught]
      - [commit, __end__, halted]
      - [commit, publish, committed]
      - [publish, __end__, halted]
      - [publish, prepare, owned_head_moved]
      - [publish, __end__, published]
    exits: {published: verify, no_change: __end__, cancelled: __end__, halted: __end__}
    gates:
      - {answerer: Human, question: "Decide an unresolved acceptance choice or a plan fact the code contradicts, before further editing", accepted: explicit choice or cancel, saved: Answer bound to issue and current attempt, resume: edit, bullets: [Resolve acceptance choice, Choose or cancel, Resume editing]}
    effects: [Foreman builds the attempt container and allocates and inspects the owned worktree., The acceptance test writer adds tests and fixtures., Builder edits source and runs checks., Foreman runs the mutation sample and checks the exact tree, commits and publishes through existing adapters.]
    invariants:
      - Preserve the tree on branch, ancestry or fingerprint mismatch. Reject scratch files and unexpected outside edits before commit. No force push.
      - The worker steps tests and edit, and the checks Foreman runs at edit and mutate, run in the attempt container built from the contract's image and setup commands (item 3). Prepare builds the container through Workspace, which owns it for the run. Commit and publish run Git and GitHub App operations on the Foreman host, and App credentials never enter the container. The builder can start the app and its related services in the container, so it runs the same checks the verifier drives. The worker CLI runs on the Foreman host, where its model credentials stay. Every shell command a worker runs goes into the attempt container, which is the boundary for those commands in place of the CLI's own host sandbox. The CLI's file tools keep their path rules on the host checkout, which the container mounts at the same path. A call whose shell cannot be routed into the container fails closed and runs no command on the host. The attempt container reaches the network only while Foreman runs the contract's setup commands, unless the contract's network is run because the app uses remote test services. After setup it has loopback only, where the app and its related services listen.
      - Prepare runs the contract's check at the pinned base once for every candidate, whatever its kind, and keeps its test report as the base's report. A failing base check stops with base_check_failed.
      - Before the first build of a candidate with a criterion proven by test or contract, prepare routes needs_tests, and a separate worker in the verifier role writes acceptance tests and fixtures from the plan and the base tree (item 9). It writes only test and fixture files. Foreman proves, from the check run at the base with them, that the check's test report lists them and that they fail. Tests that pass at the base or that the report does not list return to the writer with the exact evidence. Foreman records the accepted tests' paths and content digest. A candidate with no criterion proven by test or contract, such as a refactor proven by drive or a revert slice, routes prepared straight to edit.
      - Run the contract's check command in edit against the final candidate. The check includes the accepted tests, and Foreman proves they pass. Capture the candidate tree before and after a successful command. Commit may publish only the unchanged checked tree. Receipt binds command, result and tree.
      - The builder cannot weaken the checks (item 10). After the builder answers, edit compares the candidate tree with the recorded accepted tests' paths and digest and with the pinned base. A test ID in the base's report or the accepted tests that the candidate's report omits or marks skipped, an edited accepted test or a changed protected file returns to edit as checks_weakened with the exact files, before mutate runs. A base test ID the slice lists as removed or renamed may be missing from the candidate's report. Any other missing or skipped ID is checks_weakened. A slice of kind protected may change only the protected files it names and never a CI workflow. A slice of kind revert may delete only the tests that its merge_commit_sha added.
      - After a passing check, Foreman flips a capped sample of changed lines with the contract's pinned mutation tool and reruns the accepted and changed tests (item 15). A mutation that no test notices returns to edit as a finding. The builder adds a test that notices it or names it in equivalent_mutations with the reason no test can notice it. Foreman leaves a named equivalent mutation out of the next sample, and review pass (b) rules on each claim. A rejected claim is a blocking pass (b) finding that gives the reason the mutation changes behavior. It needs no demonstration, because Foreman's mutation run already showed that no test notices it, and the repair's next sample includes it again. A slice of kind revert restores code from before its merge_commit_sha, so mutate samples none of its lines.
      - Rejected tests, failed checks, weakened checks, surviving mutations and failed Verify criteria each count once toward the failed-check cap.
      - If the code contradicts a fact in the plan, the builder does not build it and asks through implement's question gate, citing the plan fact and the code (item 11).
      - no_change is typed builder evidence (item 12): on a first attempt with no edits, the checks showing the acceptance already holds on the pinned base and their results. A clean tree without that evidence, no_change with edits, or no_change on a repair fails edit's own check of the answer. It is an invalid answer, so dispatch gives it the one repair turn (item 1), and a second invalid answer stops with invalid_output.
      - On a repair the run's PR is already open. A cancellation there closes it with the cancellation, so no open PR outlives its run.
      - Plain code for the acceptance test proof and the mutation sample lives in src/foreman/proof.py, so implement.py stays a router within its line ceiling.
      - Use the owned PR branch for repairs. Only a confirmed GitHub conflict allows a base merge. Repairs resume the builder's saved session when the checkout fingerprint matches (D5).
      - Publication validates repository, issue marker, branch, base and exact head. A moved head loses prior check and review authority. Unrecognized work is preserved and never adopted.
      - Report the changed-line count for the checked tree. Change size does not block publication. Acceptance-specific evidence stays in the issue and tests.
    failure_and_resume:
      halts: [dirty_worktree, env_unavailable, git_failed, implementation_rejected, failed_check_cap, publish_failed, publication_model_missing, publication_unreconciled, base_check_failed]
      retries: {failed_checks: src/foreman/models.toml#max_review_rounds}
      recovery: Save the failed command, test, mutation or file evidence and increment the failed-check count before comparison. Below the existing cap resume the owning step on the reconciled candidate. At the cap report failed_check_cap. A container that does not build or a setup command that fails stops with env_unavailable. A failing check at the base stops with base_check_failed at prepare. Re-enter commit by validating the recorded parent and expected tree. Re-enter publish by reading the remote branch and matching PR before any repeated write. If the outcome remains ambiguous, stop with publication_unreconciled. Dispatch owns paid attempt accounting.
    implementation: {module: src/foreman/steps/implement.py, entry: compile_stage, max_lines: 420, allowed_imports: [workspace, github, stage_output, dispatch, budget, check_output, contract, proof], shared: [Workspace, Forge, dispatch], never_does: [merge the PR, run a standalone proof gate, require a universal tool-fact record, let the builder edit accepted tests]}
    checks: {IM1: tests/test_dispatch_recovery.py, IM2: tests/test_delivery.py, IM3: tests/test_publication.py, IM4: tests/test_publication.py, IM5: tests/test_acceptance_tests.py, IM6: tests/test_mutation.py, IM7: tests/test_publication.py, IM8: tests/test_delivery.py, IM9: tests/test_delivery.py, IM10: tests/test_smoke.py, IM11: tests/test_publication.py, IM12: tests/test_mutation.py, IM13: tests/test_permissions.py, PU1: tests/test_publication.py, PU2: tests/test_publication.py}
    scenarios:
      IM1: {given: A saved session and partial edits with unexpected branch or fingerprint, expect: Preserve work and refuse unsafe resume.}
      IM2: {given: A local check fails then passes within the allowance, expect: Return exact failure to edit and publish only the tested tree.}
      IM3: {given: "Detached HEAD, unrelated history, scratch inclusion or tree changes after checks", expect: Stop before push and preserve evidence.}
      IM4: {given: Commit succeeded before checkpoint failure with recorded parent and expected tree, expect: Adopt the matching clean commit once.}
      IM5: {given: "Acceptance tests that pass at the base, or that the check does not collect", expect: Return the exact evidence to the writer and start no builder call until the check collects them and they fail at the base.}
      IM6: {given: A passing change with a sampled mutated line that no test notices, expect: Return the surviving mutation to edit as a finding and commit only after every sampled mutation fails a test.}
      IM7: {given: "The builder deletes a test, adds a skip, edits an accepted test or changes the check command, and a slice that lists a test it removes with the reason", expect: "Edit returns the exact files as checks_weakened before mutate runs, and nothing is published until they are restored. The listed test's missing ID is not a weakened check."}
      IM8: {given: "The builder leaves a clean tree without no_change evidence, or returns no_change on a repair", expect: "Dispatch sends the exact validation error back for one repair turn, and a second invalid answer stops with invalid_output. No question gate opens. Typed no_change evidence on a first attempt with a clean tree ends no_change."}
      IM9: {given: The plan states a field an engine route returns and the related checkout shows the route does not return it, expect: The builder asks through the question gate citing both and builds nothing.}
      IM10: {given: A smoke repository whose check needs a local server, expect: "The builder starts the server in the attempt container and runs the check itself, and Verify reports the criterion passed with a capture."}
      IM11: {given: A Ready revert issue whose slice reverts a merge commit that added acceptance tests, expect: "Prepare skips the acceptance tests, edit accepts the removal of exactly the tests that commit added, mutate samples nothing and the revert publishes."}
      IM12: {given: "A surviving mutation that the builder names as equivalent with a reason, and a refactor slice proven by drive", expect: "The next sample leaves that mutation out and review pass (b) rules on the claim. A rejected claim routes to implement and the next sample includes the mutation again. The refactor routes prepared to edit without acceptance tests, and edit compares its report with the base's report prepare kept."}
      IM13: {given: "A worker shell command sent after the run's container stops in the middle of a call, and one while it runs", expect: "The first fails and nothing runs on the host. Workspace rebuilds the container at the next step entry, or that step stops env_unavailable. The second reports that it ran inside the container."}
      PU1: {given: Timed-out push already placed the checked head on the remote, expect: Adopt without a second push.}
      PU2: {given: A PR open times out, expect: Adopt the verified matching PR once or report publication_unreconciled if observation cannot establish the outcome.}
    decisions: [D4, D5, D7, D8, D14, D15]
    warp: {equivalent: Building and revisions, page: https://docs.warp.dev/factories/runners/, also: [https://docs.warp.dev/guides/agent-workflows/running-an-issue-to-pr-blueprint/], divergence: "Warp's implementer runs on a runner whose image and setup commands live in the factory definition (runners/linux-build.yaml in 02-sdlc-issue-to-pr). Foreman reads them from the target repository's contract file. Warp's implementer writes its own tests. Foreman has a separate worker write acceptance tests first and proves them and the mutation sample with plain code, because a builder can weaken checks it controls (tools #162, #163). Foreman owns Git integrity and exact publication recovery across local CLI interruptions."}

  verify:
    title: Use the change as a user would
    purpose: Drive the published head with the target repository's own verify skill, post the evidence and route on the verdict.
    scope: Exact published PR head in the exclusive target_checkout inside the attempt container, slice acceptance, the related services the contract starts and the verify skill at the contract's path at the pinned base. The verifier runs the app and edits nothing.
    entry: Implement confirms the published checked head.
    worker: verifier
    model_policy: nodes.verify
    instructions:
      prompt: docs/graph/blueprint/prompts/verify.md
      runtime_prompt: src/foreman/stages/verify.md
      context: [Published PR and head, slice and acceptance, assumptions, the repository's verify skill, related services from the contract]
    skills:
      - {ref: verify-<app>/SKILL.md, repository: target_repository, when: always, kind: target_skill, lines: null, method: "Drive the change with the target repository's own skill at the contract's verify_skill path, created by pstack create-verification-skill and kept current by maintain-verification-skill."}
    inputs:
      run: Intake supplies issue, repo and pinned base, required.
      plan: Spec supplies the slice, its acceptance criteria and their proofs, required.
      work: Implement supplies the attempt container, exclusive checkout, PR identity and published head, required.
      checks: Implement supplies the exact checked head, required.
    outputs:
      schema: foreman.stage_output.VerifyOutput
      fields: [tested_head, criteria]
      consumers: [review, implement, operator]
      outcomes: {posted: Every drivable criterion passed, failed: A criterion failed, unverified: A drivable criterion is unverified, head_moved: The PR head moved after publication, cancelled: The human posted a stop, halted: Verify stopped}
    steps:
      drive: {actor: Verifier, action: "Drive the changed flow at the published head with the contract's verify skill", result: "Each criterion passed, failed or unverified with evidence, or a stop that Foreman read before the call", owner: drive, check: VF1}
      post: {actor: Foreman, action: Post the evidence comment and route on the verdict, result: Observed GitHub comment bound to the tested head and the typed verdict, owner: post, check: VF2}
    transitions:
      - [__start__, drive, null]
      - [drive, __end__, head_moved]
      - [drive, __end__, cancelled]
      - [drive, __end__, halted]
      - [drive, post, driven]
      - [post, __end__, head_moved]
      - [post, __end__, halted]
      - [post, __end__, failed]
      - [post, __end__, unverified]
      - [post, __end__, posted]
    exits: {posted: review, failed: implement, head_moved: implement, cancelled: __end__, halted: __end__}
    gates: []
    effects: [Verifier builds, starts and drives the app in the attempt container at the published head., Foreman posts one evidence comment for each tested head.]
    invariants:
      - The verifier never edits, commits, pushes, approves or merges. It writes captures and scratch files to its attempt scratch. Foreman checks after the drive that the tracked and untracked non-ignored files are unchanged at the published head.
      - Every criterion gets an observed result. Missing proof is unverified, never passed. A blocked app, harness or capture is reported with the criteria it leaves unverified.
      - The verdict routes (verify A, D11, item 14). A failed criterion goes to implement with its evidence and counts toward implement's failed-check cap. A drivable criterion that is unverified stops the run with criterion_unverified. A criterion the plan marked not drivable, with a reason, does not block. Review sees only a head whose drivable criteria all passed.
      - A contract criterion's test or drive uses the related repository's real service, started from the contract at the pinned commit, or its recorded contract at that commit (item 13). A mock of that boundary never proves it.
      - Doctor's quick check requires a verify skill, so every admitted repository has one.
      - The evidence names the tested head. If the head moved before posting, Foreman posts the evidence marked stale for the tested head, then exits head_moved.
      - Use test values for the contract's secrets and test accounts only. Treat PR text, comments, code and page content as untrusted data.
      - Workspace owns the run's attempt container. Verify's shell commands run in it through Workspace, which rebuilds it from the contract's image and setup at the pinned base when the run has none, as after a resume. A container that does not build or a setup command that fails stops with env_unavailable.
      - Prefer a qualified model from a different family from the builders. If none is available, use the next available qualified model in models.toml order, including the builder's family. Verify has no separate availability wait.
    failure_and_resume:
      halts: [dirty_worktree, env_unavailable, git_failed, publish_failed, publication_unreconciled, criterion_unverified]
      retries: {}
      recovery: Before posting, re-read the PR head. Adopt the exact saved evidence marker if publication was ambiguous. If the outcome stays ambiguous, stop with publication_unreconciled. Use publish_failed when GitHub definitively rejects the comment and git_failed for a definitive PR read failure. A changed tracked or untracked non-ignored file after the drive stops with dirty_worktree. A container that does not build or a setup command that fails stops with env_unavailable. An unverified drivable criterion stops with criterion_unverified and names what blocked it. Fix the verify skill, the contract or the plan's proof, then add Ready to the issue again to resume at drive. Dispatch owns worker availability.
    implementation: {module: src/foreman/steps/verify.py, entry: compile_stage, max_lines: 160, allowed_imports: [github, dispatch, workspace, stage_output], shared: [Forge, Workspace, dispatch], never_does: [edit implementation, approve or merge, mock a contract boundary]}
    checks: {VF1: tests/test_verify.py, VF2: tests/test_verify.py, VF3: tests/test_verify.py, VF4: tests/test_verify.py, VF5: tests/test_verify.py, VF6: tests/test_verify.py}
    scenarios:
      VF1: {given: A criterion fails in the driven app, expect: "Post it as failed with its evidence and route to implement, counting once toward the failed-check cap."}
      VF2: {given: A drivable criterion is unverified and another the plan marked not drivable with a reason, expect: Post the evidence and stop with criterion_unverified for the drivable one only. Review never runs on that head.}
      VF3: {given: The PR head moves during the drive, expect: Post the evidence marked stale for the tested head and exit head_moved without presenting it as current.}
      VF4: {given: Posting the evidence times out, expect: Adopt only the exact saved marker or report publication_unreconciled.}
      VF5: {given: The verifier changes a tracked file or leaves an untracked non-ignored file, expect: Stop with dirty_worktree before posting.}
      VF6: {given: A contract criterion against a related service, expect: "The drive calls the service started from the related checkout at its pin, or its recorded contract, and the capture shows the call."}
    decisions: [D7, D11]
    warp: {equivalent: Computer Use verification, page: https://docs.warp.dev/factories/use-cases/computer-use-verification/, divergence: "Foreman runs unattended, so verification runs in-line on every published head before review instead of on a maintainer's label. Warp's recipe reports evidence for a maintainer. Foreman routes on it because no person stands between Verify and the merge (verify A). A moved head returns to Implement, as Review's does, because Foreman must reconcile the head before anything verifies it again."}

  review:
    title: Review the full pull request
    purpose: Answer three fixed questions about the current head and route on typed severity.
    scope: Full PR diff at current head and recorded diff base, read through one diff command, the issue text, the related repository checkouts, and the contract's check command in the attempt container. The reviewer edits nothing.
    entry: Verify hands over the published checked head whose drivable criteria all passed. Merge can return a known checked head for fresh review, which keeps the evidence already posted for that head.
    worker: reviewer
    model_policy: nodes.review
    instructions:
      prompt: docs/graph/blueprint/prompts/review.md
      runtime_prompt: src/foreman/stages/review.md
      context: [Issue text, exact full diff and base, related repository checkouts, slice acceptance, file list and assumptions, verify evidence for the head, equivalent mutations the builder named, prior settled rulings]
    skills:
      - {ref: src/foreman/skills/review-quality.md, when: always, kind: repository_skill, heading: Review quality, lines: null, method: Cite evidence and assign severity.}
      - {ref: blast-radius/SKILL.md, when: always, kind: skill, lines: null, method: Find the one fact the change is safe because of and what it breaks beyond the diff.}
    inputs:
      run: Intake supplies origin issue identity and issue text, required.
      plan: Spec supplies bound acceptance, the file list and the assumptions, required.
      work: GitHub provides repository, PR identity, full diff base and head, required.
      checks: Implement supplies exact checked head, required.
      verify: Verify supplies each criterion's result and evidence for the head. A known checked head that Merge returns for fresh review keeps the evidence already posted for it, required.
      review: Prior settled rulings and findings are context when present.
    outputs:
      schema: foreman.stage_output.ReviewOutput
      fields: [findings, human_question]
      consumers: [implement, merge, operator]
      outcomes: {P0: Repair critical evidenced defect, P1: Repair serious evidenced defect, none: Hand off exact current head with advisory comments, head_moved: Re-establish checked evidence, cancelled: The human cancelled, halted: Review stopped}
    steps:
      inspect: {actor: Reviewer, action: Answer three fixed questions in three fresh passes, result: "Typed findings pinned to head and base, each blocking one with a demonstration or a cited file:line, or a stop that Foreman read before the call", owner: inspect, check: RV1}
      demonstrate: {actor: Foreman, action: Run each blocking demonstration at the reviewed head, result: "Blocking findings whose demonstration fails, the rest advisory, plus Foreman's finding for files outside the plan's list", owner: demonstrate, check: RV7}
      post: {actor: Foreman, action: Post exact-head findings, result: Observed GitHub report and typed severity, owner: post, check: RV2}
      route: {actor: Foreman, action: Route by finding severity, result: Repair or merge or named stop, owner: route, check: RV3}
    transitions:
      - [__start__, inspect, null]
      - [inspect, __end__, head_moved]
      - [inspect, __end__, cancelled]
      - [inspect, __end__, halted]
      - [inspect, demonstrate, assessed]
      - [demonstrate, __end__, head_moved]
      - [demonstrate, __end__, halted]
      - [demonstrate, post, demonstrated]
      - [post, __end__, head_moved]
      - [post, __end__, halted]
      - [post, route, posted]
      - [route, __end__, halted]
      - [route, __end__, P0]
      - [route, __end__, P1]
      - [route, __end__, none]
    exits: {P0: implement, P1: implement, head_moved: implement, none: merge, cancelled: __end__, halted: __end__}
    gates:
      - {answerer: Human, question: Decide a disputed scope or product rule for the reviewed head, accepted: scoped ruling or cancel, saved: "Ruling bound to finding and head. The question posts its reply marker on the issue, so the human's reply resumes review.", resume: inspect, bullets: [Resolve scope or rule, Decide or cancel, Resume review]}
    effects: [Foreman grants one diff command, runs each demonstration and posts one COMMENT review for each exact report., Foreman records the head and typed route.]
    invariants:
      - "Every round runs three passes over the full current PR, each in a fresh session (item 17). Pass (a), against the issue text and not the plan, asks whether the change delivers the issue, and only the issue. Pass (b) asks what the change breaks beyond the diff in callers, data and security. Pass (c) asks whether it is a fix or a patch: does it remove the cause, or add a guard, retry, wrapper or flag the plan did not name, duplicate existing code or ignore the repository's pattern? The three passes post together as one report."
      - A blocking finding from pass (a) or (b) carries a failing demonstration. The reviewer edits nothing, so it returns the demonstration in the finding as a command, or as a test file's path and content. Foreman writes that file to the attempt scratch, runs it at the head in the attempt container and never commits it. If the demonstration does not fail, the finding is advisory. A blocking finding from pass (c) cites the file:line of the existing code it duplicates or works around.
      - Foreman adds one advisory finding itself that names each changed file outside the plan's file list and the tests.
      - A new test that mocks a boundary named in the plan's assumptions list is a blocking finding from pass (b) (item 13). It cites the file:line of the mock and the assumption it replaces, as a pass (c) finding does, and needs no demonstration, because a test that mocks the boundary passes whatever the real service does.
      - The reviewer reads the diff through the one granted diff command and may run the contract's check command (item 16). Foreman keeps no per-file read list and parses no proof of reading.
      - Review's shell commands run in the run's attempt container through Workspace, which rebuilds it when the run has none, as Verify does. A container that does not build or a setup command that fails stops with env_unavailable.
      - Prior diffs or rulings are context and cannot carry review authority across heads.
      - Prefer a qualified model from a different family from the builders. If none is available, use the next available qualified model in models.toml order, including the builder's family. Review has no separate availability wait.
      - Severity is an enum with P0 then P1 then none. Only concrete correctness, security or scope defects, or a pass (c) patch that cites the code it duplicates or works around, qualify. P2 and lower remain comments.
      - The missing optional tool record alone cannot be classified as a defect. A reviewer cannot approve or merge.
      - Verify evidence is context. Review runs only on a head whose drivable criteria all passed.
      - A review question is bound to the head and finding and posts its reply marker like every other gate (item 18).
    failure_and_resume:
      halts: [review_cap, review_not_posted, env_unavailable, git_failed, publication_unreconciled]
      retries: {blocking_rounds: src/foreman/models.toml#max_review_rounds}
      recovery: Before posting, re-read the current head. Adopt the exact saved report marker if publication was ambiguous. If the outcome stays ambiguous, stop with publication_unreconciled. Use git_failed for a definitive PR or diff read failure and env_unavailable for a container that does not build or a setup command that fails. Count each completed blocking round once before comparison. At the cap report review_cap without another repair. Reconcile an owned moved head before re-review. Dispatch owns worker availability.
    implementation: {module: src/foreman/steps/review.py, entry: compile_stage, max_lines: 300, allowed_imports: [github, dispatch, review_context, stage_output, workspace], shared: [Forge, Workspace, dispatch], never_does: [edit implementation, submit human approval, impose tool-fact bookkeeping, keep a per-file read list]}
    checks: {RV1: tests/test_review_context.py, RV2: tests/test_review_rounds.py, RV3: tests/test_review_rounds.py, RV4: tests/test_review_availability.py, RV5: tests/test_review_availability.py, RV6: tests/test_review_availability.py, RV7: tests/test_review_rounds.py, RV8: tests/test_review_rounds.py, RV9: tests/test_runner.py, RV10: tests/test_review_context.py, RV11: tests/test_review_rounds.py}
    scenarios:
      RV1: {given: A later revision retains a defective unchanged hunk, expect: Detect it in the full pinned diff and discard earlier clearance.}
      RV2: {given: A correct change lacks an optional tool record, expect: Post an advisory note and route none with zero repair calls for that note.}
      RV3: {given: A repairable P1 and an advisory note both exist, expect: Record P1 ahead of none and repair the same PR below cap.}
      RV4: {given: A legitimate repair completes and a previous optional evidence note reappears, expect: No second repair for that note and fresh full review at the current head.}
      RV5: {given: Preferred reviewers run out of quota or have no installed CLI, expect: Start a fresh session with the next available qualified model. Pause in the shared quota wait only if all qualified models are unavailable. Resume selection there. Review emits no availability halt.}
      RV6: {given: Posting a review times out, expect: Adopt only the exact saved report marker or report publication_unreconciled when the write cannot be reconciled.}
      RV7: {given: A pass (a) finding marked P1 whose demonstration passes at the head, expect: Post it as advisory and route none for it.}
      RV8: {given: A change that touches a file outside the plan's file list and its tests, expect: Foreman's advisory finding names the file. A pass (c) finding without a cited file:line is advisory.}
      RV11: {given: A new test that mocks the engine route named in the plan's assumptions, expect: "A blocking pass (b) finding cites the mock's file:line and the assumption, with no demonstration, and routes to implement."}
      RV9: {given: The reviewer asks about a disputed rule and the human replies on the issue, expect: "The question is bound to head and finding, posts its reply marker, and the reply resumes review."}
      RV10: {given: One review round, expect: "Three fresh sessions, one per fixed question, one diff command and no per-file read list, and one posted report."}
    decisions: [D1, D5, D7, D8, D11, D13]
    warp: {equivalent: Reviewing and revision routing, page: https://docs.warp.dev/factories/use-cases/code-review/, also: [https://docs.warp.dev/factories/blueprints/routes/], divergence: "Warp's review checks the change against the issue's acceptance criteria and runs current-head validation from a review-policy skill, and its verdict is advisory for a human who merges. Foreman fixes three questions, has plain code run each demonstration, and routes P0 or P1 itself because no person merges (merge B) and models favour their own output."}

  merge:
    title: Queue, confirm and, if needed, revert the merge
    purpose: Arm only the reviewed checked head, confirm the merge commit in production, and revert Foreman's own merge when the confirmation fails.
    scope: Exact target repository PR, branch, base, checked head, GitHub merge receipt and the contract's read-only production check.
    entry: Review returns none for this checked head. Authenticated GitHub wakes resume the saved step.
    worker: null
    model_policy: null
    instructions: {prompt: null, context: []}
    skills: []
    inputs:
      run: Intake supplies issue and target repository, required.
      work: Implement provides opened PR identity and checked commit, required.
      checks: Local evidence binds checked head, required.
      review: Exact-head report and typed none, required.
      merge: Fresh GitHub checks, approvals, queue and PR evidence at every decision.
      contract: The target contract supplies the production check and its time limit, required.
    outputs:
      schema: foreman.readiness.MergeReceipt
      merge_binding: The GitHub PR record captured at merge must show merged=true and head.sha equal to the reviewed head. Record merge_commit_sha separately because a squash or queue merge can produce a different SHA.
      source: https://docs.github.com/en/rest/pulls/pulls#get-a-pull-request
      consumers: [operator, eligible child runs]
      outcomes: {merged: Reviewed revision merged and confirmed in production, reverted: Production check failed and the revert and regression issues are filed, closed: PR closed without merge, reviewable_head: New observed head has valid build evidence, repair: Owning run must repair, cancelled: The human cancelled, halted: Merge cannot proceed}
    steps:
      arm: {actor: Foreman, action: "Read the PR from GitHub, then the issue for a stop, then queue the exact reviewed head", result: Observed queue or arm receipt or a stop, owner: arm, check: ME1}
      observe: {actor: Foreman, action: Read the GitHub merge outcome, result: Matching merge receipt or typed alternate outcome, owner: observe, check: ME2}
      confirm: {actor: Foreman, action: "Run the contract's production check against the merge commit", result: Production confirmation or the failed check's evidence, owner: confirm, check: ME6}
      release: {actor: Foreman, action: Start each Ready dependent issue as its own run, result: Each eligible dependent starts as a new run through the runner, owner: release, check: ME3}
      revert: {actor: Foreman, action: File the revert and regression issues, result: "A Ready revert issue for the merge commit that starts as a new run through the runner, and a regression issue with the evidence", owner: revert, check: ME7}
      report: {actor: Foreman, action: Record the typed merge outcome, result: Persisted run result or repair route, owner: report, check: DN1}
    transitions:
      - [__start__, arm, null]
      - [arm, report, halted]
      - [arm, report, cancelled]
      - [arm, report, reviewable_head]
      - [arm, report, repair]
      - [arm, observe, armed]
      - [arm, observe, already_armed]
      - [arm, observe, closed_or_merged]
      - [arm, observe, head_unverified]
      - [observe, report, halted]
      - [observe, report, cancelled]
      - [observe, report, closed]
      - [observe, report, reviewable_head]
      - [observe, report, repair]
      - [observe, confirm, merged]
      - [confirm, release, confirmed]
      - [confirm, revert, production_failed]
      - [confirm, report, halted]
      - [release, report, released]
      - [release, report, halted]
      - [revert, report, reverted]
      - [revert, report, halted]
      - [report, __end__, null]
    exits: {merged: __end__, reverted: __end__, closed: __end__, reviewable_head: review, repair: implement, cancelled: __end__, halted: __end__}
    gates:
      - {route: head_unverified, answerer: Human, question: Provide evidence for the ownership of the unexpected PR revision, accepted: scoped evidence or cancel, saved: Evidence bound to PR and observed head, resume: observe, bullets: [Confirm revision ownership, Supply evidence or cancel, Recheck PR revision]}
    effects: [Foreman arms the exact head through GitHub App., Foreman runs the read-only production check., Foreman files the revert and regression issues on a failed check., Foreman admits only eligible dependents after confirmation.]
    invariants:
      - Required CI is green and GitHub eligibility is fresh for the assessed head before arm. GitHub enforces approvals, rulesets and merge-group checks.
      - Merge needs a merge queue ruleset on the target repository's base branch (item 19, github.py:838). Doctor's quick check requires it, so only repositories with one can finish a run.
      - Foreman merges even when the reviewer is the builder's model family (merge B, D13). No step waits for a human approval or merge.
      - A stop cannot undo a merge. Arm, and every resume of a merge step, reads the PR before the stop. If the PR is already merged, the stop is recorded on the run as too late and the run goes on to confirm. If the PR is open, Foreman removes it from the merge queue when it is queued, closes it with the cancellation and ends cancelled. If GitHub merges it before the close lands, the observed merge wins and the run goes on to confirm.
      - Expand queue authority through synthetic replays, live smoke, about three real issues and normal volume.
      - merge_held is the default until the synthetic branch probe passes (item 19). The probe is part of doctor's full check, and admission runs the full check whenever the contract file's digest has no green record, so every admitted repository has passed it. FOREMAN_MERGE_HOLD still holds a proven repository. The exact-head arm argument protects only the request.
      - A queue acknowledgment stays pending. An authenticated relevant GitHub event wakes the checkpoint and Foreman re-reads GitHub.
      - After a matching merge Foreman runs the contract's production check against merge_commit_sha within its time limit (D12, item 20). A commit that is not deployed yet keeps confirm waiting. If it is still not deployed at the time limit, the run stops with production_unconfirmed and files no revert. Only a check that ran against the deployed commit and failed files a revert. Production credentials are never used and the check is read-only.
      - A failed production check files a revert issue carrying Ready, whose supplied slice has kind revert and carries merge_commit_sha (rollback A). Revert then starts that issue as a new run through the runner, as release starts a dependent, so the revert runs through the normal path and Foreman merges it. A revert run is not a feature run. It has no test or contract criterion, so it skips implement.tests, mutate samples none of its lines, and edit lets it delete exactly the tests merge_commit_sha added. Foreman also files a regression issue with the failed check's evidence, records the escape on the run and releases no dependents. A revert run whose own production check fails stops with production_unconfirmed and files no further revert.
      - After confirmation, release starts each dependent that still carries Ready as a new run through the runner, and triage.admit admits it once all its prerequisites merged (item 19). The new run makes its own read of its own repository's settings and inherits nothing from the run that released it. A dependent's not_ready is reported on the dependent's issue and does not change the releasing run's result. Reuse intake deduplication and keep the Ready label until admitted. Release prints no command for a person to run.
      - Foreman verifies the repository, PR, issue and owned branch from GitHub evidence and verifies Git ancestry against the saved owned revision. The human's ruling supplies evidence. Keep the head_unverified gate open until Foreman verifies both. Only verified heads can route to review or repair.
    failure_and_resume:
      halts: [merge_held, merge_not_armed, readiness_unavailable, merged_unreviewed, production_unconfirmed]
      retries: {}
      waits: {arm: Wait for GitHub checks or approval, observe: Wait for GitHub to report a merge result, confirm: Wait for the merge commit to deploy}
      recovery: Pending checks or approvals pause arm. Pending queue pauses observe. A merge commit that is not deployed yet pauses confirm until the production check's time limit, after which confirm stops with production_unconfirmed and files no revert. Reconcile the saved PR and arm receipt before a repeated write. A fixable owned head, queue or CI failure routes to implement. A known already checked head routes to review. Preserve an unrecognized head and open the head_unverified gate. Report a mismatched merge revision without credit or dependency release. Before filing a revert or regression issue, read the target repository for the saved marker and adopt a matching issue.
    implementation: {module: src/foreman/steps/merge.py, entry: compile_stage, max_lines: 320, allowed_imports: [github, readiness, state, contract], shared: [Forge], never_does: [direct merge, submit human approval, infer merged from queued, release dependents before confirmation]}
    checks: {ME1: tests/test_readiness.py, ME2: tests/test_merge_receipt.py, ME3: tests/test_runner.py, ME4: tests/test_merge_receipt.py, ME5: tests/test_merge_receipt.py, ME6: tests/test_merge_receipt.py, ME7: tests/test_merge_receipt.py, ME8: tests/test_readiness.py, ME9: tests/test_readiness.py, ME10: tests/test_runner.py, ME11: tests/test_runner.py, DN1: tests/test_delivery.py}
    scenarios:
      ME1: {given: The PR moves before arm, expect: Stale evidence cannot arm.}
      ME2: {given: GitHub reports a squash or queue merge with a distinct merge commit SHA, expect: Record both SHAs and accept the merge only when the PR head at merge matches the reviewed head.}
      ME3: {given: "Queue pending and rejection precede the confirmed merge of the last prerequisite for an issue that still carries Ready, with duplicate wakes", expect: "Wait, repair, then start the dependent once through the runner without another Ready label event and without printing a command for a person to run. The dependent's run uses the login and caps from its own start."}
      ME4: {given: The human says an unexpected head belongs to the run but lineage has no verification, expect: Stay at head_unverified without adopting or repairing the revision.}
      ME5: {given: GitHub arms the PR before interruption or reports a merge of an unreviewed head, expect: Adopt the existing arm once and give no delivery credit or dependent release to the unreviewed head.}
      ME6: {given: "The production check reports the merge commit not deployed then passing, or not deployed past its time limit", expect: "Wait in confirm, then release dependents and end merged. Past the time limit stop with production_unconfirmed and file no revert."}
      ME7: {given: The production check fails for the merge commit, or a revert run's own check fails, expect: "File one Ready revert issue for merge_commit_sha and one regression issue, record the escape and end reverted with no dependent release. A failing revert run stops with production_unconfirmed and files no further revert."}
      ME8: {given: A run is reviewed with the builder's family as reviewer in a proven repository, expect: Arm the reviewed head with no human approval step.}
      ME9: {given: "A stop posted after the PR merged, and one posted while it is queued", expect: "The first is recorded as too late and the run confirms and ends merged. The second removes the PR from the queue, closes it and ends cancelled."}
      ME10: {given: "A run waiting on the merge queue, the operator sets a cap that won't parse, and GitHub then reports the merge", expect: "The wake reads no login or cap variable, and the run goes on to confirm."}
      ME11: {given: "The operator sets FOREMAN_MERGE_HOLD after the run's start and before arm, then clears it", expect: "Arm reads the hold and reports merge_held. The run arms once after the hold is cleared."}
      DN1: {given: "An answer, child issue plan, cancellation, queued PR, closed PR, confirmed merge and revert", expect: Distinct typed exits with no completion for a queued PR.}
    decisions: [D2, D10, D12, D13]
    warp: {equivalent: Handoff and completion after merge, page: https://docs.warp.dev/factories/how-factories-work/, also: [https://docs.warp.dev/factories/use-cases/production-incident-resolution/], divergence: "Warp hands the PR to a person to merge, and its incident recipe investigates production read-only and leaves rollback to people. Foreman merges the reviewed head (merge B) and reverts its own merge on a failed production check (rollback A) because no person stands between review and production. Arming needs proven branch policy, a merge queue and GitHub's authority."}

dispatch:
  title: Run or resume a worker attempt
  purpose: Bound each paid attempt, repair one invalid answer and recover its result once.
  invocation: >-
    Each calling step holds the shared compiled dispatch graph as a statically discoverable closure.
    Inherit the parent checkpointer. Use synchronous durability before CLI launch. Preparation before
    calling is read-only because an interrupt can re-enter the calling function.
  callers: [triage.route, research.answer, spec.draft, spec.check, implement.tests, implement.edit, verify.drive, review.inspect]
  warp: {equivalent: Worker invocation and conversation reuse, page: https://docs.warp.dev/factories/factory-agents/, divergence: "Local CLIs need crash recovery and token and dollar accounting at one shared boundary. Warp continues a worker's conversation for follow-ups and revisions. Foreman saves the builder's session on every accepted answer and resumes it when the checkout fingerprint matches. Warp's stage outputs are instructions, not typed schemas, so Foreman adds one repair turn for an answer that fails output validation."}
  implementation: {module: src/foreman/dispatch.py, entry: compile_dispatch, max_lines: 290, shared: [runner, worker, budget], never_does: [choose workflow routes, publish artifacts, guess usage]}
  steps:
    reserve: {actor: Foreman, action: Save the paid-call reservation, result: Durable authorized attempt identity, owner: reserve, check: DP4}
    reconcile: {actor: Foreman, action: Reconcile or run the worker call, result: "Typed output and usage record, a repair turn, or a pause or halt", owner: reconcile, check: DP2}
  transitions:
    - [__start__, reserve, null]
    - [reserve, reconcile, admitted]
    - [reserve, __end__, halted]
    - [reconcile, reserve, eligible_fallback]
    - [reconcile, reserve, repair_turn]
    - [reconcile, __end__, accepted]
    - [reconcile, __end__, halted]
  halts: [budget_exceeded, invalid_output, git_failed, model_dependency_missing, dirty_worktree]
  retries: {provider_fallback: eligible configured model order and remaining allowance, quota_resume: explicit wake or known provider reset and remaining allowance, invalid_answer: one repair turn in the same session with the exact validation error, budget_resume: Ready added again after the operator raises the budget cap}
  invariants:
    - Runner acquires a per-repository and issue OS lock before loading the LangGraph checkpoint. Release on pause or process exit.
    - Save run, worker procedure, candidate or head, attempt id, allowance and worktree identity before every paid call.
    - Resolve worker model and CLI configuration independently of the stage procedure. The procedure owns instructions and typed outputs.
    - Resume at the interrupted step and reconcile before any repeat. A reservation alone does not establish whether the call launched. Charge each attempt once. If usage is ambiguous, charge the worst case to the budget, log usage unknown, and continue within the remaining allowance.
    - An answer that fails output validation, its schema or the stage's own checks of it (dispatch.py:208, delivery.py:141), gets one repair turn (item 1). Dispatch reserves a charged call that resumes the same session with the exact validation error. A second invalid answer stops with invalid_output.
    - Only the builder keeps a conversation (D5, item 2). For implement.edit, save the native session in run state on every accepted answer as well as on quota. A later implement.edit call for the same PR resumes it only when the checkout fingerprint matches the saved one. Otherwise it starts fresh. Every other procedure starts a fresh session for each call and resumes a saved session only to finish the same interrupted call after quota.
    - The allowance is the caps saved on the run at its last start, minus what the run has spent. Dispatch reads no repository variable.
    - Admit a call whenever the remaining dollar allowance is positive and pass the remainder to the CLI as its spending cap. Foreman never guesses a minimum cost for a call. A CLI checks its cap only after a response arrives, so the one response that crosses the cap still finishes and is billed. Dispatch charges the actual spend and then stops with budget_exceeded.
    - budget_exceeded is resumable (item 19). After the operator raises the cap and adds Ready to the issue again, the run resumes at the interrupted step within the new allowance.
    - Try available qualified models within the token and dollar allowance. Review prefers another model family and falls back in configured order once that preference cannot be met. A quota or missing CLI moves to the next qualified model. Use the shared quota wait only when none is available. Retain the caller's continuation and recheck branch, parent and fingerprint before continuing partial edits.
    - A model whose CLI cannot route its shell into the attempt container is not qualified for implement.tests, implement.edit or verify.drive. Dispatch moves to the next qualified model, as it does for a missing CLI. A reviewer without the route still qualifies; its shell commands, the check included, fail closed.
    - Every worker call writes its temporary files and captures under the run's attempt scratch, which sits under Foreman's state directory on its host. A worker whose scratch root is inside its checkout is refused before any call, and the command exits naming both paths. Foreman never moves the scratch elsewhere and never uses the shared system temp directory.
  waits: {reconcile: Wait until a qualified model becomes available}
  checks: {DP1: tests/test_dispatch_budget.py, DP2: tests/test_dispatch_recovery.py, DP3: tests/test_dispatch_recovery.py, DP4: tests/test_dispatch_recovery.py, DP5: tests/test_dispatch_recovery.py, DP6: tests/test_dispatch_recovery.py, DP7: tests/test_dispatch_budget.py, DP8: tests/test_dispatch_budget.py, DP9: tests/test_review_rounds.py}
  scenarios:
    DP1: {given: The charged result is replayed, expect: One ledger row and accepted response.}
    DP2: {given: "Crash before launch, after ambiguous send, or after a durable result", expect: "Reconcile at the interrupted step before repeating. Adopt a finished result. When usage is ambiguous, log usage unknown, charge the worst case once, and continue within the remaining allowance."}
    DP3: {given: Quota exhaustion after partial edits, expect: Verified caller and fingerprint resume under remaining allowance.}
    DP4: {given: Two wakes for one issue checkpoint, expect: "At most one active writer, no duplicate charge or external write."}
    DP5: {given: A scripted worker returns one invalid answer then a valid one, expect: The stage finishes with one extra charged call in the same session. Two invalid answers stop with invalid_output.}
    DP6: {given: An accepted builder answer then a failed check at a matching fingerprint, expect: The repair call carries the saved session's resume flag. A changed fingerprint starts fresh.}
    DP7: {given: A run stopped with budget_exceeded and the operator raises the cap and adds Ready again, expect: The run resumes at the interrupted step without a duplicate charge.}
    DP8: {given: "$0.25 of allowance remains and the next response costs $2.94", expect: "Dispatch admits the call with a $0.25 CLI cap, charges the actual $2.94 once, and stops with budget_exceeded before any further call."}
    DP9: {given: "A worker built with a scratch root inside its checkout, and one built with no scratch root", expect: Both are refused before any call.}

