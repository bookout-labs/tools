schema_version: 1
blueprint_version: 2
status: approved
baseline: b96293d6e6403e854097cb8c2c3d94afe747e286
repositories:
  foreman_repository: bookout-labs/tools
  target_repository: Canonical repository of the admitted GitHub issue.
  target_checkout: Exclusive Git checkout of target_repository, with base revision pinned at admission.
  pstack:
    repository: cursor/plugins
    revision: d42aff08aa58965d2735c4ead61a9af82b89d0d0
    directory: pstack/skills
  matt_skills:
    repository: mattpocock/skills
    revision: abeeaf95660ba9e8b7c753eb38f441ca707a8823
    directory: skills
entry: triage
intake:
  trigger: Ready label added to an issue
  delivery: GitHub App webhook
  event: issue_labeled
  run_labels:
    ready: Show eligible work waiting to start.
    doing: Show the admitted run and its current stage.
    needs_answer: Show a saved question that requires the human's decision.
    done: Show a typed terminal result.
  policy: >-
    Verify the App webhook and that the App is installed on the issue's repository, then read the current issue, repository and labels from GitHub.
    Admit only real issues that carry the Ready label. Check admission on a verified Ready label event
    or after a matching prerequisite merge for a dependent that still carries Ready. Ignore duplicate and stale
    deliveries and Foreman's own label updates. Reuse the per-issue checkpoint and lock. Mirror checkpoint state
    as one run label and one status comment with the typed result and its links. Labels do not grant authority to
    merge or answer gates.
  settings: >-
    Works for organization and personal repositories (D6). A Project board is an optional view. An organization board
    can collect labeled issues with GitHub's built-in auto-add workflow.
  source: https://docs.warp.dev/factories/automation-triggers/
overview:
  framing: "Specific to issue delivery, shared through GitHub, and scrutinized with scorers, benchmarks and a scorecard for each run."
  source: https://web.archive.org/web/20261121015523/https://www.notion.com/a-new-shape-for-work
terminal_outcomes:
  answered: GitHub confirms the answer on the originating issue.
  children_filed: GitHub confirms the planned child issues and dependency links.
  merged: GitHub reports merged=true and the PR head SHA at merge equals the reviewed head. Foreman records merge_commit_sha separately and rechecks eligible Ready dependents.
  closed: GitHub confirms the pull request closed without a merge.
  cancelled: The human explicitly cancels at a human gate.
  no_change: Implementation identifies no justified change and has published nothing.
  halted: Foreman saves a named halt and its evidence.
evidence:
  introspection: [compiled node kind, owner binding, compiled edge and route label, procedure input fields, output schema and fields, model policy selector and dependency, prompt path, skill selector, declared halts and retries, owner module line budget]
  tests: [route priority and result typing, gate authority and continuation, effects, input provenance, identity, recovery, skill activation, checked tree identity, prompt assembly]
  review: [purpose, scope, prompt content, method quality, line budget choices, allowed dependencies, Warp fit, decisions]
  note: Resolve model order from the configured policy rather than duplicating model names. Behavioral scenarios verify effective fallback and family eligibility.
rules:
  routing: >-
    A step emits one typed outcome. CI checks that every value of each typed route enum has exactly one
    route in its router. Use the transition order when checks overlap. Apply exit_normalization
    before returning from a stage, preserving the named halt and evidence.
    A stage result carries its typed outcome and artifact. The top router reads that outcome.
    An invalid worker result stops at dispatch. If a valid result still has no matching route at runtime,
    open the stage's question gate and record the unmatched result as a routing defect for the scorers.
  routing_source: https://docs.warp.dev/factories/blueprints/routes/
  exit_normalization: {foreign_repository: halted, exhausted: halted}
  gates:
    continuation: >-
      The coordinator or personal agent relays the question and posts the answer or cancellation on
      the issue under the human's identity.
      Only an answer to the open question continues the run. Silence keeps the gate open.
      An unrelated reply does not count. Gates are only for unresolved questions.
      Plan approval never waits on the human.
    checkpoint: Save the question, its exact issue or artifact identity, and the human's answer from the issue comment. Explicit cancellation for that question emits cancelled.
  prompts: Load the target prompt as the complete worker instructions and supply the declared run context separately. Deploy the prompt by replacing the runtime file.
  publication_halt: publication_unreconciled
  paths: Existing seam paths must name Git-tracked regular files in the pinned target_checkout tree. Reject absolute paths, traversal, directories and symlinks. A seam under builds has one owner. An edit-only slice names its existing seams under uses.
  reporting: Each terminal result includes issue, blueprint version, furthest stage, saved evidence, known work and raw tokens, Claude spend where known, rounds and any hand fix. Unsupported metrics are unknown.
context:
  - [GitHub checks, GitHub merge queue, Enforces repository rules]
  - [GitHub merge queue, Foreman, Reports the merge result]
  - [Human, Coordinator or personal agent, Work and decisions]
  - [Coordinator or personal agent, GitHub issue, Files and comments for the human]
  - [Foreman, Coordinator or personal agent, Gate questions]
  - [GitHub issue, Foreman, "Ready label, work, repository identity, and comments"]
  - [Foreman, GitHub issue, Run label and status comment]
  - [CARR record layer, T3, Authorized team context]
  - [T3, Coordinator or personal agent, Conversation context]
  - [Foreman, Worker CLIs, Assigns a bounded procedure]
  - [Worker CLIs, Target checkout, Reads or edits within assignment]
  - [Foreman, GitHub pull request, Publishes checked changes]
workers:
  coordinator:
    title: Investigate and plan
    steps: [triage.route, research.answer, spec.draft]
    method: Inspect the repository or issue assigned to the run and report a typed route, sourced answer or candidate.
    permissions: Read issue and pinned target_checkout.
    conversation: Use a fresh assignment with saved questions and candidate evidence when revising.
  checker:
    title: Challenge the plan
    steps: [spec.check]
    method: Probe issue fit and each slice in the target repository, including when both repositories contain the named path.
    permissions: Read pinned target_checkout and exact candidate. Return typed findings.
    conversation: Use a fresh independent session per candidate, with a qualified different family preferred.
  builder:
    title: Build and check the change
    steps: [implement.edit]
    method: Edit within acceptance, run the target repository checks and report the result.
    permissions: Write exclusive target_checkout and its attempt scratch. Foreman commits and publishes.
    conversation: Resume the verified native session for the same run, issue, target repository, PR lineage and CLI. If unavailable, start fresh from durable artifacts after reconciliation.
  verifier:
    title: Review the full change
    steps: [review.inspect]
    method: Review the complete current PR against acceptance and cite each finding.
    permissions: Read pinned diff evidence for the exact PR head and diff base. Foreman posts the report.
    conversation: Start a fresh session every round. Prefer a qualified model family that did not build the change when one is available. Use the next available qualified model in models.toml order when needed, including the builder's family.

stages:
  triage:
    title: Route the issue
    purpose: Choose research or planning for one admitted issue.
    scope: Read target_repository issue and dependencies. Update the issue's run label and status comment. No repository edits or PR writes.
    entry: A verified Ready label event or a recheck for a dependent that still carries Ready after a prerequisite merge. A saved answer resumes the route step.
    worker: coordinator
    model_policy: nodes.triage
    instructions:
      prompt: docs/graph/blueprint/prompts/triage.md
      runtime_prompt: src/foreman/stages/triage.md
      context: [Canonical repository and pinned base, unresolved intent and saved answer]
    skills: []
    inputs:
      run: Intake supplies canonical repo and issue, required for every admission.
      plan: GitHub supplies stored slice and dependencies for existing child issues.
      human_answers: On resume, Foreman supplies the saved answer the agent posted on the issue under the human's identity.
    outputs:
      schema: foreman.stage_output.TriageOutput
      fields: [human_question, slice, triage, work_kind]
      consumers: [research, spec]
      outcomes: {question: Answer the bounded question, plan: Draft a plan, supplied_slice: Validate the supplied slice, needs_human: Ask the human for missing intent, cancelled: Report cancellation, halted: Report failed admission}
    steps:
      admit:
        actor: Foreman
        action: Validate issue and prerequisites
        result: Canonical issue identity and pinned base
        owner: admit
        check: TR1
      route:
        actor: Triage worker
        action: Classify the admitted issue
        result: Typed route and supplied slice when present
        owner: route
        check: TR2
    transitions:
      - [__start__, admit, null]
      - [admit, route, admitted]
      - [admit, __end__, halted]
      - [route, __end__, question]
      - [route, __end__, plan]
      - [route, __end__, supplied_slice]
      - [route, __end__, cancelled]
      - [route, __end__, halted]
    exits: {question: research, plan: spec, supplied_slice: spec, cancelled: __end__, halted: __end__}
    gates:
      - {answerer: Human, question: Decide the missing issue intent, accepted: answer or cancel, saved: Issue-bound answer, resume: route, bullets: [Clarify issue intent, Answer or cancel, Resume triage]}
    effects: [Foreman reads GitHub and saves admission and route records., Foreman uses the GitHub adapter to mirror checkpoint state as the issue's run label and status comment.]
    invariants: [GitHub repository identity and run configuration agree., Open dependencies prevent admission and later eligibility is read from GitHub.]
    failure_and_resume:
      halts: [missing_slice]
      retries: {}
      recovery: Missing child payload stops admission. An open dependency leaves the issue unadmitted. Worker dispatch failures use shared dispatch. The human's answer resumes route.
    implementation: {module: src/foreman/steps/triage.py, entry: compile_stage, max_lines: 110, allowed_imports: [state, stage_output, github, dispatch], shared: [Forge, dispatch], never_does: [create child issues, edit source]}
    checks: {TR1: tests/test_runner.py, TR2: tests/test_delivery.py, TR3: tests/test_accept.py}
    scenarios:
      TR1: {given: The requested issue names another repository or a dependency is still open, expect: Stop before a paid call or build checkout allocation.}
      TR2: {given: A parent-labelled question and a separately supplied single slice, expect: Route the question to research and the supplied slice to spec.validate.}
      TR3: {given: A verified Ready label event arrives twice and the App adds the Doing label, expect: One admitted checkpoint and one run with the issue showing its state.}
    decisions: [D3, D6, D9]
    warp: {equivalent: Intake and conditional triage, page: https://docs.warp.dev/factories/how-factories-work/, divergence: Foreman binds GitHub issue and dependency identity before classification to prevent cross-repository work.}

  research:
    title: Answer the question
    purpose: Post one sourced answer on the originating issue.
    scope: Read target_checkout at the pinned base and the admitted issue. Write one issue answer.
    entry: Triage returns question.
    worker: coordinator
    model_policy: nodes.research
    instructions:
      prompt: docs/graph/blueprint/prompts/research.md
      runtime_prompt: src/foreman/stages/research.md
      context: [Question, canonical repository and pinned base]
    skills:
      - {ref: how/SKILL.md, when: always, kind: leaf_prompt, lines: [17, 17], method: Inspect the code and explain its architecture from source.}
      - {ref: why/SKILL.md, when: bug_fix, kind: skill, lines: [9, 9], method: Read author records and mark inferences.}
      - {ref: engineering/diagnosing-bugs/SKILL.md, repository: matt_skills, when: bug_fix, kind: skill, lines: [18, 37], method: Name a tight feedback loop that reproduces the bug before any hypothesis.}
      - {ref: engineering/diagnosing-bugs/SKILL.md, repository: matt_skills, when: perf_issue, kind: skill, lines: [18, 37], method: Name a tight feedback loop that reproduces the regression before any hypothesis.}
    inputs:
      run: Triage supplies origin issue, repository, base and question, required.
      human_answers: On resume, Foreman supplies the saved source or clarification the agent posted on the issue under the human's identity.
      plan: Triage supplies work kind, required for skill selection.
    outputs:
      schema: foreman.stage_output.ResearchOutput
      fields: [research, human_question]
      consumers: [origin issue, operator]
      outcomes: {answered: Origin issue has the saved answer, cancelled: The human cancelled, halted: Delivery stopped with evidence}
    steps:
      answer: {actor: Research worker, action: Return a sourced answer, result: Typed answer for the pinned base, owner: answer, check: RE2}
      post: {actor: Foreman, action: Post the saved answer, result: Observed issue comment, owner: post, check: RE1}
    transitions:
      - [__start__, answer, null]
      - [answer, post, answer]
      - [answer, __end__, cancelled]
      - [answer, __end__, halted]
      - [post, __end__, answered]
      - [post, __end__, halted]
    exits: {answered: __end__, cancelled: __end__, halted: __end__}
    gates:
      - {answerer: Human, question: Provide the missing external source or clarify the question, accepted: source or answer or cancel, saved: Issue-bound answer, resume: answer, bullets: [Supply missing source, Clarify or cancel, Resume research]}
    effects: [Foreman posts an issue comment keyed by run and answer digest.]
    invariants: [The worker reads the named repository and cites source evidence., Publication cannot allocate a PR.]
    failure_and_resume:
      halts: [git_failed, publication_unreconciled]
      retries: {}
      recovery: At post read the origin issue for the saved marker before another write. Adopt the matching comment. If the write remains ambiguous, stop with publication_unreconciled. Dispatch owns worker failures.
    implementation: {module: src/foreman/steps/research.py, entry: compile_stage, max_lines: 85, allowed_imports: [stage_output, github, dispatch], shared: [Forge, dispatch], never_does: [edit source, file child issues]}
    checks: {RE1: tests/test_delivery.py, RE2: tests/test_delivery.py, RE3: tests/test_delivery.py}
    scenarios:
      RE1: {given: GitHub accepts the answer before the checkpoint fails, expect: Adopt the matching comment once or report publication_unreconciled if the prior write cannot be confirmed.}
      RE2: {given: A question about a revision-sensitive symbol, expect: Return a cited answer from the pinned target base and open no PR.}
      RE3: {given: The answer needs external evidence absent from the issue and pinned checkout, expect: Pause before posting and resume answer with the human’s clarification.}
    decisions: [D7]
    warp: {equivalent: Research and answer, page: https://docs.warp.dev/factories/factory-agents/, divergence: Foreman confirms one issue comment because the source is GitHub.}

  spec:
    title: Plan and check the work
    purpose: Clear an exact repository-bound candidate or file its linked child issues.
    scope: Read-only target_checkout at pinned base until filing. GitHub child writes stay in target_repository.
    entry: Triage requests a draft or supplies a slice for common validation. Revisions stay within this stage.
    worker: coordinator
    model_policy: nodes.spec
    instructions:
      prompt: docs/graph/blueprint/prompts/spec.md
      runtime_prompt: src/foreman/stages/spec.md
      context: [Canonical repository and pinned base, prior candidate and findings, the human's saved answer]
    skills:
      - {ref: architect/SKILL.md, when: always, kind: skill, lines: [9, 9], method: Trace affected systems and sketch two ownership shapes.}
      - {ref: statechart/SKILL.md, when: stateful, kind: skill, lines: [23, 27], method: Describe state transitions and invariants.}
      - {ref: engineering/to-tickets/SKILL.md, repository: matt_skills, when: parent, kind: skill, lines: [29, 40], method: Cut thin end-to-end slices and name each blocking edge.}
    inputs:
      run: Triage supplies canonical issue, target repository and pinned base, required.
      plan: Triage supplies a stored slice, or spec supplies a draft and bound prior findings for revision.
      human_answers: Foreman reads clarifications, comments, approvals and stop requests the agent posts on the issue under the human's identity.
    outputs:
      schema: foreman.stage_output.SpecOutput
      fields: [questions, slices, spec, spec_gate]
      consumers: [implement, child issue runs, operator]
      outcomes: {ready: Worker supplied a candidate for validation, needs_human: The human must answer grounded questions, validated_single: One candidate slice cleared both checks, children_filed: All children and links confirmed, cancelled: The human cancelled, halted: Planning stopped}
    steps:
      draft: {actor: Spec worker, action: Draft repository-bound slices, result: Candidate and grounded questions when present, owner: draft, check: SP1}
      validate: {actor: Foreman, action: Validate repository and seam paths, result: Ordered exact candidate or typed defect, owner: validate, check: SC1}
      check: {actor: Independent checker, action: Check and approve the plan, result: Model approval or findings for the checked candidate, owner: check, check: SC2}
      file_children: {actor: Foreman, action: File and link child issues, result: Observed children and dependency links, owner: file_children, check: FS1}
    transitions:
      - [__start__, validate, supplied_slice]
      - [__start__, draft, plan]
      - [draft, validate, ready]
      - [draft, __end__, cancelled]
      - [draft, __end__, halted]
      - [validate, __end__, foreign_repository]
      - [validate, __end__, exhausted]
      - [validate, draft, repair]
      - [validate, check, valid]
      - [check, __end__, exhausted]
      - [check, draft, changes]
      - [check, __end__, cancelled]
      - [check, __end__, validated_single]
      - [check, file_children, validated_parent]
      - [check, __end__, halted]
      - [file_children, __end__, children_filed]
      - [file_children, __end__, halted]
    exits: {validated_single: implement, children_filed: __end__, cancelled: __end__, halted: __end__}
    gates:
      - {answerer: Human, question: "Decide the unresolved product, repository, architecture or policy choice", accepted: explicit choice or cancel, saved: Answer scoped to the candidate and choice, resume: draft, bullets: [Resolve planning choice, Choose or cancel, Resume drafting]}
      - {answerer: Human, question: Resolve an intent choice identified by the independent checker, accepted: explicit choice or cancel, saved: Answer scoped to the candidate and choice, resume: check, bullets: [Resolve checker question, Choose or cancel, Resume plan check]}
    effects: [Foreman saves draft and verdict by candidate revision., Only file_children creates or adopts child issues and links by stable parent issue and slice marker.]
    invariants:
      - The candidate digest binds target_repository, pinned base, issue and approved content scope. A changed digest needs fresh validation and checking.
      - Validate explicit repository and path identity before a paid plan check. The checker independently assesses ambiguous issue intent and repository ownership.
      - Every existing seam is a Git-tracked regular file in the pinned target_checkout. Reject directories and symlinks for all slices, including directly supplied and edit-only slices. A built seam has a single provider. Slice titles are unique. Dependencies are acyclic. Existing edits use existing seams without inventing a new seam.
      - The independent model checker can approve the plan after validation. Ready is the drafter's claim of completeness.
      - The human may comment on, approve or stop a plan through their coordinator or personal agent. The agent posts each response as an issue comment under the human's identity. Record “we're good” as approval of the identified plan. Continue after the validator and model check clear the plan even without the human's review. A recorded stop prevents further filing or building. A separate clarification gate only asks the human to resolve an open choice.
      - File children from the cleared candidate only. Adoption verifies marker, repository, parent, body and links. Release only eligible children.
    failure_and_resume:
      halts: [invalid_output, spec_cap, git_failed, publication_unreconciled]
      retries: {plan_revisions: src/foreman/models.toml#max_review_rounds}
      recovery: Explicit foreign scope reports invalid_output before the checker. Other candidate defects save evidence, count each rejected digest once, and return to draft only while rejections remain below max_review_rounds. Dispatch reconciles paid calls before any repeat. At file_children, inspect the issue marker and links before repeating an ambiguous write. If the outcome stays ambiguous, stop with publication_unreconciled.
    implementation: {module: src/foreman/steps/spec.py, entry: compile_stage, max_lines: 410, allowed_imports: [state, stage_output, github, dispatch, spec_check, workspace], shared: [Forge, Workspace, dispatch], never_does: [edit source, choose a replacement target repository]}
    checks: {SP1: tests/test_spec_candidate.py, SP2: tests/test_spec_candidate.py, SC1: tests/test_spec_check.py, SC2: tests/test_spec_check.py, SC3: tests/test_spec_check.py, SC4: tests/test_spec_check.py, SC5: tests/test_spec_check.py, FS1: tests/test_runner.py}
    scenarios:
      SP1: {given: The issue names a seam also present in Foreman's installation, expect: Brief names target_repository and pinned target_checkout.}
      SP2: {given: Valid typed draft, expect: "Save one digest scoped to issue, base and repo before independent check."}
      SC1: {given: A slice names a foreign repository or a seam available only in foreman_repository, expect: Explicit mismatch stops and wrong root rejects before any builder call.}
      SC2: {given: Synthetic wrong-repository issue with matching seam names in both repositories, expect: Checker rejects implied foreign intent and no build or child filing occurs.}
      SC3: {given: The human answers a choice on candidate A then candidate B changes scope, expect: Validate and check B and ask any unresolved choice again.}
      SC4: {given: Invalid singleton seam or cyclic parent dependencies, expect: Common validator rejects both and the final allowed rejection reports spec_cap.}
      SC5: {given: The model clears a validated plan with no human response or after the agent posts optional human approval on the issue, expect: Proceed without a manual approval step. Honor a stop the agent posts under the human's identity before implementing or filing.}
      FS1: {given: A child issue or link write times out, expect: Adopt the matching result once and complete missing links. Report publication_unreconciled if the write cannot be confirmed.}
    decisions: [D3, D7, D8, D9]
    warp: {equivalent: Planning and plan gate, page: https://docs.warp.dev/factories/blueprints/gates/, divergence: Foreman validates repository and dependencies deterministically. The independent model checker can approve the plan and the human's review is optional.}

  implement:
    title: Build and publish the change
    purpose: Publish exactly the tree that passed the target repository's checks.
    scope: Exclusive target_checkout, candidate issue, attempt parent, owned branch and matching PR. No direct base-branch writes.
    entry: Spec clears one slice, review returns a blocking finding, or merge returns a verified repair route.
    worker: builder
    model_policy: nodes.implement
    instructions:
      prompt: docs/graph/blueprint/prompts/implement.md
      runtime_prompt: src/foreman/stages/implement.md
      context: [Candidate and acceptance, existing PR and head, exact repository checks, blocking repair evidence]
    skills:
      - {ref: tdd/SKILL.md, when: bug_fix, kind: skill, lines: [9, 31], method: Reproduce cheaply and rerun the focused regression check.}
      - {ref: benchmark-checklist/SKILL.md, when: perf_issue, kind: skill, lines: [13, 27], method: Verify benchmark conditions, result and relevance.}
      - {ref: verify-<app>/SKILL.md, repository: target_repository, when: always, kind: target_skill, lines: null, method: "Verify with the target repository's own skill, created by pstack create-verification-skill and kept current by maintain-verification-skill."}
      - {ref: formal-<area>/SKILL.md, repository: target_repository, when: always, kind: target_skill, lines: null, method: "When the target repository has its own formal verification skill, created by pstack create-formal-verification-skill, run its check on any change that touches the verified code. When the change is intended, update the verification with maintain-formal-verification-skill."}
    inputs:
      run: Intake supplies issue, repo and pinned base, required.
      plan: Spec supplies one cleared slice and matching candidate revision, required.
      work: Prepare supplies exclusive checkout, branch and pinned attempt parent before edit.
      checks: Repository configuration supplies preflight and the check command, required.
      review: Review or merge supplies PR-bound repair evidence, conditional.
    outputs:
      schema: foreman.stage_output.ImplementOutput
      fields: [implementation, human_question]
      consumers: [review, operator]
      outcomes: {published: Confirmed PR at checked head, no_change: No justified change, cancelled: The human cancelled, halted: No valid checked publication}
    steps:
      prepare: {actor: Foreman, action: Prepare and reconcile the worktree, result: Trusted checkout and attempt parent, owner: prepare, check: IM1}
      edit: {actor: Builder, action: Edit and run target repository checks, result: "Checked candidate tree, exact command failure, or the shared optional human_question for the acceptance gate", owner: edit, check: IM2}
      commit: {actor: Foreman, action: Commit or adopt the checked tree, result: Exact commit with tested tree, owner: commit, check: IM4}
      publish: {actor: Foreman, action: Publish the checked commit, result: "Confirmed repository, PR, branch, base and head", owner: publish, check: PU2}
    transitions:
      - [__start__, prepare, null]
      - [prepare, __end__, halted]
      - [prepare, edit, prepared]
      - [edit, __end__, cancelled]
      - [edit, __end__, no_change]
      - [edit, __end__, halted]
      - [edit, edit, check_failed]
      - [edit, commit, checked]
      - [commit, __end__, halted]
      - [commit, publish, committed]
      - [publish, __end__, halted]
      - [publish, prepare, owned_head_moved]
      - [publish, __end__, published]
    exits: {published: review, no_change: __end__, cancelled: __end__, halted: __end__}
    gates:
      - {answerer: Human, question: Decide an unresolved acceptance choice before further editing, accepted: explicit choice or cancel, saved: Answer bound to issue and current attempt, resume: edit, bullets: [Resolve acceptance choice, Choose or cancel, Resume editing]}
    effects: [Foreman allocates and inspects the owned worktree., Builder edits source and runs checks., Foreman checks exact tree, commits and publishes through existing adapters.]
    invariants:
      - Preserve the tree on branch, ancestry or fingerprint mismatch. Reject scratch files and unexpected outside edits before commit. No force push.
      - Run the deterministic required repository command in edit against the final candidate. Capture the candidate tree before and after a successful command. Commit may publish only the unchanged checked tree. Receipt binds command, result and tree.
      - Use the owned PR branch for repairs. Only a confirmed GitHub conflict allows a base merge.
      - Publication validates repository, issue marker, branch, base and exact head. A moved head loses prior check and review authority. Unrecognized work is preserved and never adopted.
      - Report the changed-line count for the checked tree. Change size does not block publication. Acceptance-specific evidence stays in the issue and tests.
    failure_and_resume:
      halts: [dirty_worktree, env_unavailable, git_failed, implementation_rejected, verify_cap, publish_failed, publication_model_missing, publication_unreconciled]
      retries: {failed_checks: src/foreman/models.toml#max_review_rounds}
      recovery: Save failed command and exit evidence and increment the check-failure count before comparison. Below the existing cap resume edit on the reconciled candidate. At the cap report verify_cap. Re-enter commit by validating the recorded parent and expected tree. Re-enter publish by reading the remote branch and matching PR before any repeated write. If the outcome remains ambiguous, stop with publication_unreconciled. Dispatch owns paid attempt accounting.
    implementation: {module: src/foreman/steps/implement.py, entry: compile_stage, max_lines: 420, allowed_imports: [workspace, github, stage_output, dispatch, budget, check_output], shared: [Workspace, Forge, dispatch], never_does: [merge the PR, run a standalone proof gate, require a universal tool-fact record]}
    checks: {IM1: tests/test_dispatch_recovery.py, IM2: tests/test_delivery.py, IM3: tests/test_publication.py, IM4: tests/test_publication.py, PU1: tests/test_publication.py, PU2: tests/test_publication.py}
    scenarios:
      IM1: {given: A saved session and partial edits with unexpected branch or fingerprint, expect: Preserve work and refuse unsafe resume.}
      IM2: {given: A local check fails then passes within the allowance, expect: Return exact failure to edit and publish only the tested tree.}
      IM3: {given: "Detached HEAD, unrelated history, scratch inclusion or tree changes after checks", expect: Stop before push and preserve evidence.}
      IM4: {given: Commit succeeded before checkpoint failure with recorded parent and expected tree, expect: Adopt the matching clean commit once.}
      PU1: {given: Timed-out push already placed the checked head on the remote, expect: Adopt without a second push.}
      PU2: {given: A PR open times out, expect: Adopt the verified matching PR once or report publication_unreconciled if observation cannot establish the outcome.}
    decisions: [D4, D5, D7, D8]
    warp: {equivalent: Building and revisions, page: https://docs.warp.dev/guides/agent-workflows/running-an-issue-to-pr-blueprint/, divergence: Foreman owns Git integrity and exact publication recovery across local CLI interruptions.}

  review:
    title: Review the full pull request
    purpose: Post evidence for the current head and route on typed severity.
    scope: Full PR diff at current head and recorded diff base. Review worker has read-only access.
    entry: Implement confirms published checked head. Merge can return a different known checked head for fresh review.
    worker: verifier
    model_policy: nodes.review
    instructions:
      prompt: docs/graph/blueprint/prompts/review.md
      runtime_prompt: src/foreman/stages/review.md
      context: [Exact full diff and base, slice and acceptance, prior settled rulings]
    skills:
      - {ref: src/foreman/skills/review-quality.md, when: always, kind: repository_skill, heading: Review quality, lines: [3, 7], method: Cite evidence and assign severity.}
      - {ref: blast-radius/SKILL.md, when: always, kind: skill, lines: [31, 37], method: Find the one fact the change is safe because of and what it breaks beyond the diff.}
    inputs:
      run: Intake supplies origin issue identity, required.
      plan: Spec supplies bound acceptance, required.
      work: GitHub provides repository, PR identity, full diff base and head, required.
      checks: Implement supplies exact checked head, required.
      review: Prior settled rulings and findings are context when present.
    outputs:
      schema: foreman.stage_output.ReviewOutput
      fields: [findings, human_question]
      consumers: [implement, merge, operator]
      outcomes: {P0: Repair critical evidenced defect, P1: Repair serious evidenced defect, none: Hand off exact current head with advisory comments, head_moved: Re-establish checked evidence, cancelled: The human cancelled, halted: Review stopped}
    steps:
      inspect: {actor: Reviewer, action: Assess the complete current PR, result: Typed findings pinned to head and base, owner: inspect, check: RV1}
      post: {actor: Foreman, action: Post exact-head findings, result: Observed GitHub report and typed severity, owner: post, check: RV2}
      route: {actor: Foreman, action: Route by finding severity, result: Repair or merge or named stop, owner: route, check: RV3}
    transitions:
      - [__start__, inspect, null]
      - [inspect, __end__, head_moved]
      - [inspect, __end__, cancelled]
      - [inspect, __end__, halted]
      - [inspect, post, assessed]
      - [post, __end__, head_moved]
      - [post, __end__, halted]
      - [post, route, posted]
      - [route, __end__, halted]
      - [route, __end__, P0]
      - [route, __end__, P1]
      - [route, __end__, none]
    exits: {P0: implement, P1: implement, head_moved: implement, none: merge, cancelled: __end__, halted: __end__}
    gates:
      - {answerer: Human, question: Decide a disputed scope or product rule for the reviewed head, accepted: scoped ruling or cancel, saved: Ruling bound to finding and head, resume: inspect, bullets: [Resolve scope or rule, Decide or cancel, Resume review]}
    effects: [Foreman reads the full diff and posts one COMMENT review for each exact report., Foreman records the head and typed route.]
    invariants:
      - Every round starts a fresh session and assesses the full current PR. Prior diffs or rulings are context and cannot carry review authority across heads.
      - Prefer a qualified model from a different family from the builders. If none is available, use the next available qualified model in models.toml order, including the builder's family. Review has no separate availability wait.
      - Severity is an enum with P0 then P1 then none. Only concrete correctness, security or scope defects qualify. P2 and lower remain comments.
      - The missing optional tool record alone cannot be classified as a defect. A reviewer cannot approve or merge.
    failure_and_resume:
      halts: [review_cap, review_not_posted, git_failed, publication_unreconciled]
      retries: {blocking_rounds: src/foreman/models.toml#max_review_rounds}
      recovery: Before posting, re-read the current head. Adopt the exact saved report marker if publication was ambiguous. If the outcome stays ambiguous, stop with publication_unreconciled. Use git_failed for a definitive PR or diff read failure. Count each completed blocking round once before comparison. At the cap report review_cap without another repair. Reconcile an owned moved head before re-review. Dispatch owns worker availability.
    implementation: {module: src/foreman/steps/review.py, entry: compile_stage, max_lines: 235, allowed_imports: [github, dispatch, review_context, stage_output], shared: [Forge, dispatch], never_does: [edit implementation, submit human approval, impose tool-fact bookkeeping]}
    checks: {RV1: tests/test_review_context.py, RV2: tests/test_review_rounds.py, RV3: tests/test_review_rounds.py, RV4: tests/test_review_availability.py, RV5: tests/test_review_availability.py, RV6: tests/test_review_availability.py}
    scenarios:
      RV1: {given: A later revision retains a defective unchanged hunk, expect: Detect it in the full pinned diff and discard earlier clearance.}
      RV2: {given: A correct change lacks an optional tool record, expect: Post an advisory note and route none with zero repair calls for that note.}
      RV3: {given: A repairable P1 and an advisory note both exist, expect: Record P1 ahead of none and repair the same PR below cap.}
      RV4: {given: A legitimate repair completes and a previous optional evidence note reappears, expect: No second repair for that note and fresh full review at the current head.}
      RV5: {given: Preferred reviewers run out of quota or have no installed CLI, expect: Start a fresh session with the next available qualified model. Pause in the shared quota wait only if all qualified models are unavailable. Resume selection there. Review emits no availability halt.}
      RV6: {given: Posting a review times out, expect: Adopt only the exact saved report marker or report publication_unreconciled when the write cannot be reconciled.}
    decisions: [D1, D5, D7, D8]
    warp: {equivalent: Reviewing and revision routing, page: https://docs.warp.dev/factories/blueprints/routes/, divergence: Foreman uses a separate reviewer and a typed P0 or P1 route while GitHub retains approval authority.}

  merge:
    title: Queue and confirm the merge
    purpose: Arm only the reviewed checked head and report GitHub's observed result.
    scope: Exact target repository PR, branch, base, checked head and GitHub merge receipt.
    entry: Review returns none for this checked head. Authenticated GitHub wakes resume the saved step.
    worker: null
    model_policy: null
    instructions: {prompt: null, context: []}
    skills: []
    inputs:
      run: Intake supplies issue and target repository, required.
      work: Implement provides opened PR identity and checked commit, required.
      checks: Local evidence binds checked head, required.
      review: Exact-head report and typed none, required.
      merge: Fresh GitHub checks, approvals, queue and PR evidence at every decision.
    outputs:
      schema: foreman.readiness.MergeReceipt
      merge_binding: The GitHub PR record captured at merge must show merged=true and head.sha equal to the reviewed head. Record merge_commit_sha separately because a squash or queue merge can produce a different SHA.
      source: https://docs.github.com/en/rest/pulls/pulls#get-a-pull-request
      consumers: [operator, eligible child runs]
      outcomes: {merged: Reviewed revision merged, closed: PR closed without merge, reviewable_head: New observed head has valid build evidence, repair: Owning run must repair, cancelled: The human cancelled, halted: Merge cannot proceed}
    steps:
      arm: {actor: Foreman, action: Queue the exact reviewed head, result: Observed queue or arm receipt, owner: arm, check: ME1}
      observe: {actor: Foreman, action: Read the GitHub merge outcome, result: Matching merge receipt or typed alternate outcome, owner: observe, check: ME2}
      release: {actor: Foreman, action: Recheck Ready dependent issues, result: Eligible issues return to admission without another Ready label event, owner: release, check: ME3}
      report: {actor: Foreman, action: Record the typed merge outcome, result: Persisted run result or repair route, owner: report, check: DN1}
    transitions:
      - [__start__, arm, null]
      - [arm, report, halted]
      - [arm, report, reviewable_head]
      - [arm, report, repair]
      - [arm, observe, armed]
      - [arm, observe, already_armed]
      - [arm, observe, closed_or_merged]
      - [arm, observe, head_unverified]
      - [observe, report, halted]
      - [observe, report, cancelled]
      - [observe, report, closed]
      - [observe, report, reviewable_head]
      - [observe, report, repair]
      - [observe, release, merged]
      - [release, report, released]
      - [release, report, halted]
      - [report, __end__, null]
    exits: {merged: __end__, closed: __end__, reviewable_head: review, repair: implement, cancelled: __end__, halted: __end__}
    gates:
      - {route: head_unverified, answerer: Human, question: Provide evidence for the ownership of the unexpected PR revision, accepted: scoped evidence or cancel, saved: Evidence bound to PR and observed head, resume: observe, bullets: [Confirm revision ownership, Supply evidence or cancel, Recheck PR revision]}
    effects: [Foreman arms the exact head through GitHub App., Foreman records observed outcome and releases only eligible dependency links.]
    invariants:
      - Required CI is green and GitHub eligibility is fresh for the assessed head before arm. GitHub enforces approvals, rulesets and merge-group checks.
      - Expand queue authority through synthetic replays, live smoke, about three real issues and normal volume.
      - Keep merge_held until a synthetic repository probe proves that neither an outside writer nor the App can move the source branch while the arm is open. The exact-head arm argument protects only the request.
      - A queue acknowledgment stays pending. An authenticated relevant GitHub event wakes the checkpoint and Foreman re-reads GitHub.
      - After a matching merge, recheck admission for every dependent that still carries Ready. Admit only when all of its prerequisites merged. Reuse intake deduplication and keep the Ready label until admitted.
      - Foreman verifies the repository, PR, issue and owned branch from GitHub evidence and verifies Git ancestry against the saved owned revision. The human's ruling supplies evidence. Keep the head_unverified gate open until Foreman verifies both. Only verified heads can route to review or repair.
    failure_and_resume:
      halts: [merge_held, merge_not_armed, readiness_unavailable, merged_unreviewed]
      retries: {}
      waits: {arm: Wait for GitHub checks or approval, observe: Wait for GitHub to report a merge result}
      recovery: Pending checks or approvals pause arm. Pending queue pauses observe. Reconcile the saved PR and arm receipt before a repeated write. A fixable owned head, queue or CI failure routes to implement. A known already checked head routes to review. Preserve an unrecognized head and open the head_unverified gate. Report a mismatched merge revision without credit or dependency release.
    implementation: {module: src/foreman/steps/merge.py, entry: compile_stage, max_lines: 240, allowed_imports: [github, readiness, state], shared: [Forge], never_does: [direct merge, submit human approval, infer merged from queued]}
    checks: {ME1: tests/test_readiness.py, ME2: tests/test_merge_receipt.py, ME3: tests/test_runner.py, ME4: tests/test_merge_receipt.py, ME5: tests/test_merge_receipt.py, DN1: tests/test_delivery.py}
    scenarios:
      ME1: {given: The PR moves before arm or source policy has no accepted probe, expect: Stale evidence cannot arm and unproven policy reports merge_held.}
      ME2: {given: GitHub reports a squash or queue merge with a distinct merge commit SHA, expect: Record both SHAs and accept the merge only when the PR head at merge matches the reviewed head.}
      ME3: {given: "Queue pending and rejection precede the matching merge of the last prerequisite for an issue that still carries Ready, with duplicate wakes", expect: "Wait, repair, then recheck admission and admit the dependent once without another Ready label event."}
      ME4: {given: The human says an unexpected head belongs to the run but lineage has no verification, expect: Stay at head_unverified without adopting or repairing the revision.}
      ME5: {given: GitHub arms the PR before interruption or reports a merge of an unreviewed head, expect: Adopt the existing arm once and give no delivery credit or dependent release to the unreviewed head.}
      DN1: {given: "An answer, child issue plan, cancellation, queued PR, closed PR and confirmed merge", expect: Distinct typed exits with no completion for a queued PR.}
    decisions: [D2, D10]
    warp: {equivalent: Handoff and completion after merge, page: https://docs.warp.dev/factories/how-factories-work/, divergence: Foreman arms a checked head to meet the autonomous finish line, subject to proven branch policy and GitHub's authority.}

dispatch:
  title: Run or resume a worker attempt
  purpose: Bound each paid attempt and recover its result once.
  invocation: >-
    Each calling step holds the shared compiled dispatch graph as a statically discoverable closure.
    Inherit the parent checkpointer. Use synchronous durability before CLI launch. Preparation before
    calling is read-only because an interrupt can re-enter the calling function.
  callers: [triage.route, research.answer, spec.draft, spec.check, implement.edit, review.inspect]
  warp: {equivalent: Worker invocation and conversation reuse, page: https://docs.warp.dev/factories/factory-agents/, divergence: Local CLIs need crash recovery and token and dollar accounting at one shared boundary.}
  implementation: {module: src/foreman/dispatch.py, entry: compile_dispatch, max_lines: 250, shared: [runner, worker, budget], never_does: [choose workflow routes, publish artifacts, guess usage]}
  steps:
    reserve: {actor: Foreman, action: Save the paid-call reservation, result: Durable authorized attempt identity, owner: reserve, check: DP4}
    reconcile: {actor: Foreman, action: Reconcile or run the worker call, result: Typed output and usage record or a pause or halt, owner: reconcile, check: DP2}
  transitions:
    - [__start__, reserve, null]
    - [reserve, reconcile, admitted]
    - [reserve, __end__, halted]
    - [reconcile, reserve, eligible_fallback]
    - [reconcile, __end__, accepted]
    - [reconcile, __end__, halted]
  halts: [budget_exceeded, invalid_output, skill_missing, model_dependency_missing, dirty_worktree]
  retries: {provider_fallback: eligible configured model order and remaining allowance, quota_resume: explicit wake or known provider reset and remaining allowance}
  invariants:
    - Runner acquires a per-repository and issue OS lock before loading the LangGraph checkpoint. Release on pause or process exit.
    - Save run, worker procedure, candidate or head, attempt id, allowance and worktree identity before every paid call.
    - Resolve worker model and CLI configuration independently of the stage procedure. The procedure owns instructions and typed outputs.
    - Resume at the interrupted step and reconcile before any repeat. A reservation alone does not establish whether the call launched. Charge each attempt once. If usage is ambiguous, charge the worst case to the budget, log usage unknown, and continue within the remaining allowance.
    - Try available qualified models within the token and dollar allowance. Review prefers another model family and falls back in configured order once that preference cannot be met. A quota or missing CLI moves to the next qualified model. Use the shared quota wait only when none is available. Retain the caller's continuation and recheck branch, parent and fingerprint before continuing partial edits.
  waits: {reconcile: Wait until a qualified model becomes available}
  checks: {DP1: tests/test_dispatch_budget.py, DP2: tests/test_dispatch_recovery.py, DP3: tests/test_dispatch_recovery.py, DP4: tests/test_dispatch_recovery.py}
  scenarios:
    DP1: {given: The charged result is replayed, expect: One ledger row and accepted response.}
    DP2: {given: "Crash before launch, after ambiguous send, or after a durable result", expect: "Reconcile at the interrupted step before repeating. Adopt a finished result. When usage is ambiguous, log usage unknown, charge the worst case once, and continue within the remaining allowance."}
    DP3: {given: Quota exhaustion after partial edits, expect: Verified caller and fingerprint resume under remaining allowance.}
    DP4: {given: Two wakes for one issue checkpoint, expect: "At most one active writer, no duplicate charge or external write."}

# Structural declarations match the actual projection format. A worker procedure can
# share a policy selector while keeping an independently registered worker identity.
procedures:
  triage: {step: triage.route, role: coordinator, model_policy: nodes.triage, inputs: [run, plan, human_answers]}
  research: {step: research.answer, role: coordinator, model_policy: nodes.research, inputs: [run, plan, human_answers]}
  spec: {step: spec.draft, role: coordinator, model_policy: nodes.spec, inputs: [run, plan, human_answers]}
  spec_check:
    step: spec.check
    role: checker
    model_policy: nodes.spec
    model_dependency: spec
    inputs: [run, plan, human_answers]
    instructions:
      prompt: docs/graph/blueprint/prompts/spec_check.md
      runtime_prompt: src/foreman/stages/spec_check.md
      context: [Candidate digest, Scope and Intent, pinned target repository and base]
    skills:
      - {ref: interrogate/SKILL.md, when: always, kind: leaf_prompt, lines: [19, 19], method: Probe the candidate in one independent session and cite verified findings.}
    output: {schema: foreman.stage_output.SpecCheckOutput, fields: [findings, notes, human_question]}
  implement: {step: implement.edit, role: builder, model_policy: nodes.implement, inputs: [run, plan, work, checks, review]}
  review: {step: review.inspect, role: verifier, model_policy: nodes.review, model_dependency: implement, inputs: [run, plan, work, checks, review]}

# Baseline paths supply source evidence and descriptions. Proposed owner paths
# in the stage contracts are checked separately as explicit missing owners.
source_map:
  triage: [src/foreman/accept.py, src/foreman/runner.py, src/foreman/delivery.py, src/foreman/stage_output.py, src/foreman/state.py]
  research: [src/foreman/delivery.py, src/foreman/github.py, src/foreman/stage_output.py]
  spec: [src/foreman/delivery.py, src/foreman/stages.py, src/foreman/spec_check.py, src/foreman/stage_output.py, src/foreman/github.py, src/foreman/workspace.py, src/foreman/runner.py]
  implement: [src/foreman/delivery.py, src/foreman/workspace.py, src/foreman/check_output.py, src/foreman/github.py, src/foreman/stage_output.py]
  review: [src/foreman/delivery.py, src/foreman/stages.py, src/foreman/review_context.py, src/foreman/review_round.py, src/foreman/github.py, src/foreman/stage_output.py]
  merge: [src/foreman/delivery.py, src/foreman/github.py, src/foreman/readiness.py, src/foreman/runner.py, src/foreman/outcomes.py]
  dispatch: [src/foreman/runner.py, src/foreman/dispatch.py, src/foreman/worker.py, src/foreman/worker_auth.py, src/foreman/config.py, src/foreman/budget.py, src/foreman/stages.py, src/foreman/skill_rules.py, src/foreman/adapters/claude.py, src/foreman/adapters/codex.py, src/foreman/adapters/grok.py, src/foreman/models.toml]
  verification: [docs/graph/gaps.toml, docs/graph/target.mmd, evals/eval.sh, evals/promptfooconfig.yaml, evals/corpus/README.md, .github/workflows/ci.yml]
