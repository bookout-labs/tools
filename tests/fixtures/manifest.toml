ite\", run=run)\n    first = run_live_delivery(**kwargs, dispatcher=lambda *args: Outcome('failed', detail='bad output'))\n    second = run_live_delivery(**kwargs, dispatcher=lambda *args: Outcome('failed', detail='bad output'))\n    assert first == second and second[\"watch\"] == {\"issue\": 101, \"action\": \"filed\"}\n    print(\"run_live_delivery reopened SQLite: equal result; watch =\", second[\"watch\"])\nwith contextlib.redirect_stderr(io.StringIO()):\n    try:\n        argparse.ArgumentParser().error(\"invalid --watch-repo\")\n    except SystemExit as error:\n        assert error.code == 2\n        print(\"argparse.ArgumentParser.error exit:\", error.code)\n"]
