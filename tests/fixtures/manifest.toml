[fixtures."resume-tool-facts.txt"]
tool = "langgraph; langgraph-checkpoint-sqlite; pydantic"
version = "1.2.24; 3.1.3; 2.14.4"
kind = "captured_run"
claim_ids = [
  "tool-fact-ac43324cb20490332f3a15d81f7c90fd7397280a777297818145b58c0ee9f2ca",
  "tool-fact-5604148226fa3446a03e3620ffb77d33d520518d9f2b2b5e82e732f1656f194b",
  "tool-fact-f50754b1a9f13d786c260f2dfb928263b6fd2c2be95d35b5757e51b6aaf3b819",
  "tool-fact-438f3096ba2c49be4467e9ea2b09d24b895fdf77941ea3d2b067753e4ef401be",
  "tool-fact-3e8f1d7ad11d7b85e92cfe713108c9f12c9df8c1025757f9eb66c65ee29b4b97",
]
argv = ["python", "-c", '''
import inspect
import operator
from importlib.metadata import version
from pathlib import Path
from tempfile import TemporaryDirectory
from typing import Annotated
from typing_extensions import TypedDict
from langgraph.checkpoint.sqlite import SqliteSaver
from langgraph.graph import StateGraph, START, END
from langgraph.graph.state import CompiledStateGraph
from langgraph.pregel import _io
from langgraph.types import Command, UpdatesStreamPart, interrupt
from pydantic import TypeAdapter, ValidationError
from foreman.delivery import DeliveryUpdate

for package in ("langgraph", "langgraph-checkpoint-sqlite", "pydantic"):
    print(package, version(package))
parameters = inspect.signature(CompiledStateGraph.stream).parameters
required = ("input", "config", "context", "durability", "stream_mode", "version")
assert all(name in parameters for name in required)
print("stream accepts:", ", ".join(required))
print("UpdatesStreamPart:", UpdatesStreamPart.__module__, UpdatesStreamPart.__name__,
      sorted(UpdatesStreamPart.__annotations__))
print("Update metadata source:", next(line.strip() for line in
      inspect.getsource(_io.map_output_updates).splitlines() if '__metadata__' in line))

class State(TypedDict):
    path: Annotated[list[str], operator.add]

def implement(state):
    assert interrupt("Ready?") == "yes"
    return {"path": ["implement"]}

builder = StateGraph(State)
builder.add_node("triage", lambda state: {"path": ["triage"]})
builder.add_node("implement", implement)
builder.add_edge(START, "triage")
builder.add_edge("triage", "implement")
builder.add_edge("implement", END)
config = {"configurable": {"thread_id": "resume-tool-facts"}}
with TemporaryDirectory() as directory:
    database = str(Path(directory) / "checkpoint.sqlite")
    with SqliteSaver.from_conn_string(database) as saver:
        graph = builder.compile(checkpointer=saver)
        parts = list(graph.stream({"path": []}, config, context=None, durability="sync",
                                  stream_mode="updates", version="v2"))
        assert parts[0] == {"type": "updates", "ns": (), "data": {"triage": {"path": ["triage"]}}}
        print("initial update:", parts[0])
        paused = parts[1]
        assert paused["type"] == "updates" and paused["ns"] == ()
        assert list(paused["data"]) == ["__interrupt__"]
        print("interrupt part:", paused["type"], paused["ns"], list(paused["data"]),
              paused["data"]["__interrupt__"][0].value)
        resumed = list(graph.stream(Command(resume="yes"), config, context=None,
                                    durability="sync", stream_mode="updates", version="v2"))
        assert resumed == [{"type": "updates", "ns": (), "data": {"implement": {"path": ["implement"]}}}]
        print("resumed updates:", resumed)
    with SqliteSaver.from_conn_string(database) as reopened:
        checkpoint = reopened.get(config)
        assert isinstance(checkpoint, dict)
        assert checkpoint["channel_values"]["path"] == ["triage", "implement"]
        print("SqliteSaver.get after reopening channel_values['path']:", checkpoint["channel_values"]["path"])

adapter = TypeAdapter(DeliveryUpdate)
validated = adapter.validate_python({"path": ["triage"], "extra": "discarded"}, strict=True)
assert validated == {"path": ["triage"]}
print("DeliveryUpdate strict validation with extra key:", validated)
for bad in ({"path": "triage"}, {"path": [123]}):
    try:
        adapter.validate_python(bad, strict=True)
    except ValidationError as error:
        print("DeliveryUpdate rejected:", bad, [item["type"] for item in error.errors()])
    else:
        raise AssertionError("Strict validation accepted a wrongly typed path")
''']
notes = "Synthetic graph, no workers or network. Interrupt IDs and temporary paths are omitted; printed update payloads are unchanged. Reopening SQLite distinguishes persisted reducer state from per-node updates. Rerun argv from the repository root."

